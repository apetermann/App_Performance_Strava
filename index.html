<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Strava Perf"/>
  <meta name="theme-color" content="#F4F2EE"/>
  <title>Strava Performance · Alexandre Petermann</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
    body{background:#F4F2EE;font-family:'Inter',sans-serif;color:#18181B;overscroll-behavior:none;}
    ::-webkit-scrollbar{display:none;}
    input,button{font-family:'Inter',sans-serif;}
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js"></script>
  <script>
  const{useState,useEffect,useMemo}=React;
  const{LineChart,Line,BarChart,Bar,XAxis,YAxis,Tooltip,ResponsiveContainer,CartesianGrid}=Recharts;

  const T={bg:"#F4F2EE",white:"#FFFFFF",text:"#18181B",muted:"#71717A",border:"#E4E0D8",orange:"#FC4C02",orangeLight:"#FFF0EB",green:"#16A34A",greenLight:"#F0FDF4",blue:"#2563EB",blueLight:"#EFF6FF",purple:"#7C3AED",purpleLight:"#F5F3FF"};

  const pace=ms=>{if(!ms)return"--";const s=1000/ms;return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;};
  const paceN=ms=>ms?+(1000/ms/60).toFixed(2):null;
  const km=m=>((m||0)/1000).toFixed(1);
  const dur=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`;};
  const isRun=t=>["Run","TrailRun","VirtualRun"].includes(t);
  const isGym=t=>["WeightTraining","Yoga","Workout"].includes(t);
  const emoji=t=>({Run:"🏃",Ride:"🚴",WeightTraining:"🏋️",Yoga:"🧘"}[t]||"🏅");
  const fmtFull=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  const fmtMon=d=>new Date(d).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
  const DAYS=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];

  /* ── DEMO DATA ──────────────────────────────────────────────────────── */
  function buildDemo(){
    const acts=[];let id=1;
    const runs=[
      ["2025-11-04",4.0,1.547,142],["2025-11-11",4.5,1.558,143],["2025-11-18",5.0,1.561,144],["2025-11-25",4.8,1.555,143],
      ["2025-12-02",4.2,1.608,144],["2025-12-06",4.8,1.615,145],["2025-12-09",5.2,1.619,145],["2025-12-13",4.5,1.610,144],["2025-12-16",5.0,1.622,146],["2025-12-23",4.8,1.618,145],
      ["2026-01-06",5.0,1.709,146],["2026-01-08",5.2,1.714,147],["2026-01-13",4.8,1.707,146],["2026-01-15",5.5,1.718,147],["2026-01-20",5.0,1.712,147],["2026-01-22",6.0,1.720,148],["2026-01-27",5.2,1.716,147],["2026-01-29",5.5,1.721,148],
      ["2026-02-03",5.5,1.803,148],["2026-02-05",6.0,1.808,149],["2026-02-10",5.8,1.805,148],["2026-02-12",6.2,1.812,149],["2026-02-17",5.5,1.806,148],["2026-02-19",6.5,1.815,149],["2026-02-22",6.0,1.810,149],["2026-02-24",5.8,1.807,148],["2026-02-27",6.2,1.813,149],
      ["2026-03-03",6.0,1.852,149],["2026-03-05",6.5,1.856,150],["2026-03-10",7.0,1.859,150],["2026-03-12",6.2,1.853,149],["2026-03-17",6.8,1.858,150],["2026-03-19",8.3,1.848,152],["2026-03-24",6.5,1.855,150],["2026-03-26",7.0,1.860,151],["2026-03-31",6.2,1.854,150],
      ["2026-04-07",6.5,1.880,150],["2026-04-09",7.0,1.885,151],["2026-04-14",6.8,1.882,150],["2026-04-17",7.5,1.888,151],["2026-04-22",7.0,1.884,151],["2026-04-26",6.5,1.881,151],["2026-04-30",5.1,1.916,156],
      ["2026-05-01",4.2,1.900,142],["2026-05-03",5.1,1.916,156],["2026-05-04",4.8,1.905,151],
    ];
    runs.forEach(([ds,dk,spd,hr])=>{
      acts.push({id:id++,type:"Run",name:"Corrida",start_date:ds+"T07:00:00Z",distance:dk*1000,moving_time:Math.round(dk*1000/spd),average_speed:spd,has_heartrate:true,average_heartrate:hr,max_heartrate:Math.round(hr+20),total_elevation_gain:Math.round(30+Math.random()*60),suffer_score:Math.round(40+Math.random()*65),average_cadence:Math.round(83+Math.random()*8),calories:Math.round(dk*65)});
    });
    let d=new Date("2025-11-04");
    while(d<=new Date("2026-05-04")){const dow=d.getDay();if(dow===1||dow===3||dow===5)acts.push({id:id++,type:"WeightTraining",name:"Musculação",start_date:new Date(d).toISOString().replace("T00","T07"),distance:0,moving_time:3600,average_speed:0,has_heartrate:false});d.setDate(d.getDate()+1);}
    return acts.sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
  }
  const DEMO_ACTS=buildDemo();
  const DEMO_ATH={id:99,firstname:"Alexandre",lastname:"Petermann",city:"Belo Horizonte",country:"Brasil"};
  const DEMO_STATS={ytd_run_totals:{count:47,distance:256000,moving_time:145000,elevation_gain:3400},all_run_totals:{count:47,distance:256000,moving_time:145000,elevation_gain:3400}};

  /* ── COMPUTE ──────────────────────────────────────────────────────── */
  function computeDash(acts,stats){
    const runs=acts.filter(a=>isRun(a.type)).sort((a,b)=>new Date(a.start_date)-new Date(b.start_date));
    if(!runs.length)return null;
    let streak=0;
    const today=new Date("2026-05-04");
    let ws=new Date(today);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
    while(streak<52){const we=new Date(ws);we.setDate(we.getDate()+7);if(!runs.some(r=>{const d=new Date(r.start_date);return d>=ws&&d<we;}))break;streak++;ws.setDate(ws.getDate()-7);}
    const first=runs.slice(0,4),last=runs.slice(-4);
    const firstP=first.reduce((s,r)=>s+paceN(r.average_speed),0)/first.length;
    const lastP=last.reduce((s,r)=>s+paceN(r.average_speed),0)/last.length;
    const biggest=[...runs].sort((a,b)=>b.distance-a.distance)[0];
    const bestPR=[...runs].sort((a,b)=>b.average_speed-a.average_speed)[0];
    const weekAgo=new Date(today);weekAgo.setDate(weekAgo.getDate()-7);
    const wRuns=runs.filter(r=>new Date(r.start_date)>=weekAgo&&r.has_heartrate);
    const avgHR=wRuns.length?Math.round(wRuns.reduce((s,r)=>s+r.average_heartrate,0)/wRuns.length):null;
    const wEffort=wRuns.reduce((s,r)=>s+(r.suffer_score||0),0);
    const monthly={};
    runs.forEach(r=>{
      const k=fmtMon(r.start_date);
      if(!monthly[k])monthly[k]={label:k,runs:0,km:0,paceSum:0,hrSum:0,hrN:0,order:new Date(r.start_date).getTime()};
      monthly[k].runs++;monthly[k].km+=r.distance/1000;monthly[k].paceSum+=paceN(r.average_speed)||0;
      if(r.has_heartrate){monthly[k].hrSum+=r.average_heartrate;monthly[k].hrN++;}
    });
    const monthlyData=Object.values(monthly).sort((a,b)=>a.order-b.order).map(m=>({label:m.label,km:+m.km.toFixed(1),corridas:m.runs,pace:+(m.paceSum/m.runs).toFixed(2),hr:m.hrN?Math.round(m.hrSum/m.hrN):null}));
    return{totalKm:+(stats?.ytd_run_totals?.distance/1000||runs.reduce((s,r)=>s+r.distance,0)/1000).toFixed(0),runCount:stats?.ytd_run_totals?.count||runs.length,streak,bestPace:pace(bestPR.average_speed),bestPaceDate:fmtFull(bestPR.start_date),firstPaceStr:pace(first[0]?.average_speed),lastPaceStr:pace(last[last.length-1]?.average_speed),paceEvo:lastP-firstP,biggestKm:+(biggest.distance/1000).toFixed(1),biggestMonth:fmtFull(biggest.start_date),avgHR,weekEffort:wEffort,monthlyData};
  }

  function getWeek(acts,anchor){
    const ref=new Date(anchor||new Date());
    const dow=(ref.getDay()+6)%7;
    const mon=new Date(ref);mon.setDate(mon.getDate()-dow);
    return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(d.getDate()+i);const ds=d.toISOString().split("T")[0];return{date:d,acts:acts.filter(a=>a.start_date.startsWith(ds))};});
  }

  function buildHeatmap(acts){
    const map={};
    acts.forEach(a=>{const k=a.start_date.split("T")[0];if(!map[k])map[k]=[];map[k].push(a.type);});
    const start=new Date("2025-11-03"),end=new Date("2026-05-04"),weeks=[];
    let cur=new Date(start);
    while(cur<=end){const week=[];for(let i=0;i<7;i++){const k=cur.toISOString().split("T")[0];week.push({key:k,types:map[k]||[]});cur.setDate(cur.getDate()+1);}weeks.push(week);}
    return weeks;
  }

  /* ── STRAVA API ───────────────────────────────────────────────────── */
  const STOK="https://www.strava.com/oauth/token";
  const SAUTH="https://www.strava.com/oauth/authorize";
  const SAPI="https://www.strava.com/api/v3";
  const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};

  /* ── COMPONENTS ──────────────────────────────────────────────────── */
  function ChTip({active,payload,label,fmt}){
    if(!active||!payload?.length)return null;
    return React.createElement("div",{style:{background:T.white,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 12px",fontSize:12,boxShadow:"0 4px 12px rgba(0,0,0,0.08)"}},
      React.createElement("div",{style:{color:T.muted,marginBottom:2}},label),
      React.createElement("div",{style:{color:T.orange,fontWeight:700}},fmt?fmt(payload[0].value):payload[0].value)
    );
  }

  function MetCard({value,unit,label,sub,badge,bColor="#FC4C02",bBg}){
    return React.createElement("div",{style:{background:T.white,border:`1px solid ${T.border}`,borderRadius:16,padding:"18px 16px"}},
      React.createElement("div",{style:{display:"flex",alignItems:"baseline",gap:4,marginBottom:6}},
        React.createElement("span",{style:{fontFamily:"'Syne',sans-serif",fontSize:36,fontWeight:800,color:T.text,lineHeight:1}},value),
        unit&&React.createElement("span",{style:{fontSize:12,color:T.muted,fontWeight:500}},unit)
      ),
      React.createElement("div",{style:{fontSize:13,fontWeight:600,color:T.text,marginBottom:3}},label),
      sub&&React.createElement("div",{style:{fontSize:11,color:T.muted,lineHeight:1.4}},sub),
      badge&&React.createElement("div",{style:{display:"inline-block",marginTop:8,padding:"3px 10px",borderRadius:100,background:bBg||bColor+"18",color:bColor,fontSize:10,fontWeight:700}},badge)
    );
  }

  function Sec({children}){
    return React.createElement("div",{style:{fontFamily:"'Syne',sans-serif",fontSize:11,fontWeight:700,color:T.muted,letterSpacing:2,textTransform:"uppercase",padding:"24px 0 12px"}},children);
  }

  /* ── APP ──────────────────────────────────────────────────────────── */
  function App(){
    const[demo,setDemo]=useState(true);
    const[cid,setCid]=useState(()=>ls.get("s_cid")||"");
    const[cs,setCs]=useState(()=>ls.get("s_cs")||"");
    const[tokens,setTokens]=useState(()=>ls.get("s_tok"));
    const[athlete,setAthlete]=useState(null);
    const[acts,setActs]=useState([]);
    const[stats,setStats]=useState(null);
    const[loading,setLoading]=useState(false);
    const[error,setError]=useState("");
    const[showSetup,setShowSetup]=useState(false);

    useEffect(()=>{if(demo){setAthlete(DEMO_ATH);setActs(DEMO_ACTS);setStats(DEMO_STATS);}},[demo]);

    useEffect(()=>{
      const p=new URLSearchParams(window.location.search);
      const code=p.get("code"),_cid=ls.get("s_cid"),_cs=ls.get("s_cs");
      if(!code||!_cid||!_cs)return;
      window.history.replaceState({},"",window.location.pathname);
      (async()=>{
        setLoading(true);
        try{const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:_cid,client_secret:_cs,code,grant_type:"authorization_code"})});const d=await r.json();if(d.access_token){ls.set("s_tok",d);setTokens(d);setDemo(false);}else setError("Erro: "+(d.message||"token inválido"));}
        catch{setError("Falha na conexão");}
        setLoading(false);
      })();
    },[]);

    const getToken=async()=>{
      if(!tokens)return null;
      if(Date.now()/1000<(tokens.expires_at||0)-60)return tokens.access_token;
      const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:ls.get("s_cid"),client_secret:ls.get("s_cs"),refresh_token:tokens.refresh_token,grant_type:"refresh_token"})});
      const d=await r.json();if(d.access_token){ls.set("s_tok",d);setTokens(d);return d.access_token;}return null;
    };

    const api=async path=>{const t=await getToken();if(!t)throw new Error("Sem acesso");const r=await fetch(SAPI+path,{headers:{Authorization:`Bearer ${t}`}});if(!r.ok)throw new Error(`Erro ${r.status}`);return r.json();};

    useEffect(()=>{
      if(!tokens||demo)return;
      (async()=>{
        setLoading(true);setError("");
        try{const[ath,activities]=await Promise.all([api("/athlete"),api("/athlete/activities?per_page=200")]);setAthlete(ath);setActs(activities);const st=await api(`/athletes/${ath.id}/stats`);setStats(st);}
        catch(e){setError(e.message);}
        setLoading(false);
      })();
    },[tokens]);

    const disconnect=()=>{ls.del("s_tok");ls.del("s_cid");ls.del("s_cs");setTokens(null);setDemo(true);setShowSetup(false);};

    const dash=useMemo(()=>computeDash(acts,stats),[acts,stats]);
    const weekDays=useMemo(()=>getWeek(acts,"2026-05-04"),[acts]);
    const heatmap=useMemo(()=>buildHeatmap(acts),[acts]);

    const wrap={background:T.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",paddingBottom:40};
    const cardStyle={background:T.white,border:`1px solid ${T.border}`,borderRadius:16,padding:16};

    /* Setup Modal */
    if(showSetup&&!tokens){
      const inp={width:"100%",background:T.bg,border:`1px solid ${T.border}`,borderRadius:10,padding:"12px 14px",color:T.text,fontSize:14,outline:"none",boxSizing:"border-box"};
      return React.createElement("div",{style:{background:T.bg,minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:24}},
        React.createElement("div",{style:{background:T.white,borderRadius:20,padding:32,maxWidth:400,width:"100%",boxShadow:"0 20px 60px rgba(0,0,0,0.12)"}},
          React.createElement("div",{style:{fontFamily:"'Syne',sans-serif",fontSize:24,fontWeight:800,marginBottom:4}},"Conectar Strava"),
          React.createElement("div",{style:{fontSize:13,color:T.muted,marginBottom:24,lineHeight:1.8}},
            "1. Acesse ",React.createElement("span",{style:{color:T.orange}},"strava.com/settings/api"),React.createElement("br"),
            "2. Crie um app (qualquer nome)",React.createElement("br"),
            "3. \"Callback Domain\": ",React.createElement("span",{style:{color:T.orange}},window.location.hostname),React.createElement("br"),
            "4. Cole as credenciais abaixo"
          ),
          React.createElement("div",{style:{display:"flex",flexDirection:"column",gap:10,marginBottom:16}},
            React.createElement("input",{style:inp,placeholder:"Client ID",value:cid,onChange:e=>setCid(e.target.value)}),
            React.createElement("input",{style:inp,type:"password",placeholder:"Client Secret",value:cs,onChange:e=>setCs(e.target.value)})
          ),
          error&&React.createElement("div",{style:{color:"#DC2626",fontSize:12,marginBottom:12}},"⚠ "+error),
          React.createElement("button",{onClick:()=>{
            if(!cid.trim()||!cs.trim()){setError("Preencha os campos");return;}
            ls.set("s_cid",cid.trim());ls.set("s_cs",cs.trim());setError("");
            const red=window.location.origin+window.location.pathname;
            window.location.href=`${SAUTH}?client_id=${cid.trim()}&redirect_uri=${encodeURIComponent(red)}&response_type=code&approval_prompt=force&scope=read,activity:read_all`;
          },style:{width:"100%",background:T.orange,border:"none",borderRadius:10,padding:13,color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}},"CONECTAR COM STRAVA →"),
          React.createElement("button",{onClick:()=>setShowSetup(false),style:{width:"100%",background:"none",border:"none",color:T.muted,fontSize:12,cursor:"pointer",marginTop:10,padding:8}},"← voltar ao demo")
        )
      );
    }

    /* Main */
    return React.createElement("div",{style:wrap},
      /* HEADER */
      React.createElement("div",{style:{background:T.white,borderBottom:`1px solid ${T.border}`,padding:"16px 20px",position:"sticky",top:0,zIndex:50}},
        React.createElement("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
          React.createElement("div",null,
            React.createElement("div",{style:{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:800}},athlete?`${athlete.firstname} ${athlete.lastname}`:"—"),
            React.createElement("div",{style:{fontSize:11,color:T.muted,marginTop:1}},"Strava · Dashboard de Performance")
          ),
          React.createElement("div",{style:{textAlign:"right"}},
            React.createElement("div",{style:{fontSize:10,color:T.muted}},`Atualizado: ${new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"})}`),
            React.createElement("div",{style:{display:"flex",gap:6,marginTop:4,justifyContent:"flex-end"}},
              demo
                ? React.createElement("button",{onClick:()=>setShowSetup(true),style:{background:T.orange,border:"none",borderRadius:8,padding:"5px 10px",color:"#fff",fontSize:10,fontWeight:700,cursor:"pointer"}},"CONECTAR")
                : React.createElement("button",{onClick:disconnect,style:{background:T.bg,border:`1px solid ${T.border}`,borderRadius:8,padding:"5px 10px",color:T.muted,fontSize:10,cursor:"pointer"}},"Sair"),
              demo&&React.createElement("div",{style:{background:T.orangeLight,border:`1px solid ${T.orange}30`,borderRadius:8,padding:"5px 8px",color:T.orange,fontSize:9,fontWeight:700}},"DEMO")
            )
          )
        ),
        loading&&React.createElement("div",{style:{marginTop:8,height:2,background:`linear-gradient(90deg,${T.orange},${T.orange}40)`,borderRadius:2}})
      ),

      React.createElement("div",{style:{padding:"0 16px"}},

        /* STREAK */
        dash&&React.createElement("div",{style:{background:`linear-gradient(135deg,${T.orange},#FF6B35)`,borderRadius:16,padding:"20px 18px",marginTop:16,color:"#fff",position:"relative",overflow:"hidden"}},
          React.createElement("div",{style:{position:"absolute",right:-20,top:-20,fontSize:80,opacity:0.15}},"🔥"),
          React.createElement("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},
            React.createElement("span",{style:{fontSize:22}},"🔥"),
            React.createElement("span",{style:{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800}},`${dash.streak} semanas consecutivas`)
          ),
          React.createElement("div",{style:{fontSize:12,opacity:0.85,marginBottom:14}},`Meta de 52 semanas — ${Math.round(dash.streak/52*100)}% concluído`),
          React.createElement("div",{style:{background:"rgba(255,255,255,0.25)",borderRadius:100,height:6,marginBottom:6}},
            React.createElement("div",{style:{background:"#fff",borderRadius:100,height:6,width:`${Math.min(dash.streak/52*100,100)}%`}})
          ),
          React.createElement("div",{style:{fontSize:11,opacity:0.8}},`${52-dash.streak} semanas restantes`)
        ),

        /* METRICS */
        dash&&React.createElement(React.Fragment,null,
          React.createElement(Sec,null,"Métricas · Últimos 6 meses"),
          React.createElement("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
            React.createElement(MetCard,{value:dash.totalKm,unit:"km",label:"Total de km",sub:`em ${dash.runCount} corridas`,badge:"+93% vs nov/25",bColor:T.green,bBg:T.greenLight}),
            React.createElement(MetCard,{value:dash.bestPace,unit:"min/km",label:"Melhor Ritmo (PR)",sub:dash.bestPaceDate,badge:"🏅 RP no segmento",bColor:T.orange}),
            React.createElement(MetCard,{value:dash.paceEvo<0?`−${Math.abs(dash.paceEvo).toFixed(2).replace(".",":")}`:"+"+dash.paceEvo.toFixed(2).replace(".",":"),unit:"min/km",label:"Evolução de Pace",sub:"em 6 meses",badge:dash.paceEvo<0?"↑ Acima da média":"→ Em progresso",bColor:dash.paceEvo<0?T.green:"#CA8A04",bBg:dash.paceEvo<0?T.greenLight:"#FEFCE8"}),
            dash.avgHR&&React.createElement(MetCard,{value:dash.avgHR,unit:"bpm",label:"FC Média",sub:"semana atual",badge:"Zona aeróbica",bColor:T.blue,bBg:T.blueLight}),
            React.createElement(MetCard,{value:dash.weekEffort||"—",label:"Esforço Relativo",sub:"esta semana",badge:"Treinamento consistente",bColor:T.purple,bBg:T.purpleLight}),
            React.createElement(MetCard,{value:dash.biggestKm,unit:"km",label:"Maior Corrida",sub:dash.biggestMonth,badge:"Distância pessoal",bColor:T.orange})
          )
        ),

        /* INSIGHT */
