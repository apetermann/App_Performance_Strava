<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="Strava Perf"/>
  <meta name="theme-color" content="#F4F2EE"/>
  <title>Strava Performance</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:#F4F2EE;font-family:'Inter',sans-serif;color:#18181B;overscroll-behavior:none}
    ::-webkit-scrollbar{display:none}
    .syne{font-family:'Syne',sans-serif;font-weight:800}
    input,button{font-family:'Inter',sans-serif;cursor:pointer}
  </style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const {useState,useEffect,useMemo,createElement:h}=React;

/* ── CREDENCIAIS FIXAS ── */
const CLIENT_ID   = "235154";
const CLIENT_SEC  = "503e9c222e53cac459e0788ddac6f23ef692e1a2";
const REDIRECT    = window.location.origin + window.location.pathname;
const STOK        = "https://www.strava.com/oauth/token";
const SAUTH       = "https://www.strava.com/oauth/authorize";
const SAPI        = "https://www.strava.com/api/v3";

const T={bg:"#F4F2EE",white:"#FFFFFF",text:"#18181B",muted:"#71717A",border:"#E4E0D8",
  orange:"#FC4C02",green:"#16A34A",greenL:"#F0FDF4",blue:"#2563EB",blueL:"#EFF6FF",
  purple:"#7C3AED",purpleL:"#F5F3FF"};

/* ── UTILS ── */
const pace=ms=>{if(!ms)return"--";const s=1000/ms;return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;};
const paceN=ms=>ms?+(1000/ms/60).toFixed(2):null;
const isRun=t=>["Run","TrailRun","VirtualRun"].includes(t);
const isGym=t=>["WeightTraining","Yoga","Workout"].includes(t);
const fmtFull=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const fmtMon=d=>new Date(d).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
const DAYS=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},
  set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};

/* ── COMPUTE ── */
function computeDash(acts,stats){
  const runs=acts.filter(a=>isRun(a.type)).sort((a,b)=>new Date(a.start_date)-new Date(b.start_date));
  if(!runs.length)return null;
  let streak=0;
  const today=new Date();
  let ws=new Date(today);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));
  for(let i=0;i<52;i++){
    const we=new Date(ws);we.setDate(we.getDate()+7);
    if(!runs.some(r=>{const d=new Date(r.start_date);return d>=ws&&d<we;}))break;
    streak++;ws.setDate(ws.getDate()-7);
  }
  const first=runs.slice(0,4),last=runs.slice(-4);
  const firstP=first.reduce((s,r)=>s+(paceN(r.average_speed)||0),0)/first.length;
  const lastP=last.reduce((s,r)=>s+(paceN(r.average_speed)||0),0)/last.length;
  const biggest=[...runs].sort((a,b)=>b.distance-a.distance)[0];
  const bestPR=[...runs].sort((a,b)=>b.average_speed-a.average_speed)[0];
  const weekAgo=new Date();weekAgo.setDate(weekAgo.getDate()-7);
  const wRuns=runs.filter(r=>new Date(r.start_date)>=weekAgo&&r.has_heartrate);
  const avgHR=wRuns.length?Math.round(wRuns.reduce((s,r)=>s+r.average_heartrate,0)/wRuns.length):null;
  const wEffort=wRuns.reduce((s,r)=>s+(r.suffer_score||0),0);
  const monthly={};
  runs.forEach(r=>{
    const k=fmtMon(r.start_date);
    if(!monthly[k])monthly[k]={label:k,runs:0,km:0,paceSum:0,hrSum:0,hrN:0,order:new Date(r.start_date).getTime()};
    monthly[k].runs++;monthly[k].km+=r.distance/1000;monthly[k].paceSum+=(paceN(r.average_speed)||0);
    if(r.has_heartrate){monthly[k].hrSum+=r.average_heartrate;monthly[k].hrN++;}
  });
  const monthlyData=Object.values(monthly).sort((a,b)=>a.order-b.order)
    .map(m=>({label:m.label,km:+m.km.toFixed(1),corridas:m.runs,
      pace:+(m.paceSum/m.runs).toFixed(2),hr:m.hrN?Math.round(m.hrSum/m.hrN):null}));
  return{
    totalKm:+(((stats?.ytd_run_totals?.distance||runs.reduce((s,r)=>s+r.distance,0))/1000)).toFixed(0),
    runCount:stats?.ytd_run_totals?.count||runs.length,
    streak,bestPace:pace(bestPR.average_speed),bestPaceDate:fmtFull(bestPR.start_date),
    firstPaceStr:pace(first[0]?.average_speed),lastPaceStr:pace(last[last.length-1]?.average_speed),
    paceEvo:lastP-firstP,biggestKm:+(biggest.distance/1000).toFixed(1),
    biggestMonth:fmtFull(biggest.start_date),avgHR,weekEffort:wEffort,monthlyData
  };
}

function getWeek(acts){
  const ref=new Date();const dow=(ref.getDay()+6)%7;
  const mon=new Date(ref);mon.setDate(mon.getDate()-dow);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const ds=d.toISOString().split("T")[0];
    return{date:d,acts:acts.filter(a=>a.start_date.startsWith(ds))};
  });
}

function buildHeatmap(acts){
  const map={};
  acts.forEach(a=>{const k=a.start_date.split("T")[0];if(!map[k])map[k]=[];map[k].push(a.type);});
  const start=new Date("2025-11-03"),end=new Date(),weeks=[];
  let cur=new Date(start);
  while(cur<=end){
    const week=[];
    for(let i=0;i<7;i++){const k=cur.toISOString().split("T")[0];week.push({key:k,types:map[k]||[]});cur.setDate(cur.getDate()+1);}
    weeks.push(week);
  }
  return weeks;
}

/* ── SVG CHARTS ── */
function LineChart({data,dataKey,color,height=120}){
  const vals=data.map(d=>d[dataKey]).filter(v=>v!=null);
  if(!vals.length)return null;
  const min=Math.min(...vals),max=Math.max(...vals),range=max-min||1;
  const W=300,H=height,pad=8;
  const pts=data.filter(d=>d[dataKey]!=null).map((d,i,arr)=>({
    x:pad+(i/Math.max(arr.length-1,1))*(W-pad*2),
    y:H-pad-((d[dataKey]-min)/range)*(H-pad*2),
    v:d[dataKey],label:d.label
  }));
  const path=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const area=path+` L${pts[pts.length-1].x.toFixed(1)},${H} L${pts[0].x.toFixed(1)},${H} Z`;
  return h("div",{style:{overflowX:"auto"}},
    h("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:H}},
      h("defs",null,h("linearGradient",{id:"lg"+dataKey,x1:"0",y1:"0",x2:"0",y2:"1"},
        h("stop",{offset:"0%",stopColor:color,stopOpacity:0.3}),
        h("stop",{offset:"100%",stopColor:color,stopOpacity:0})
      )),
      h("path",{d:area,fill:`url(#lg${dataKey})`}),
      h("path",{d:path,fill:"none",stroke:color,strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"}),
      pts.map((p,i)=>h("circle",{key:i,cx:p.x,cy:p.y,r:3,fill:color})),
      pts.filter((_,i)=>i%Math.ceil(pts.length/5)===0||i===pts.length-1).map((p,i)=>
        h("text",{key:i,x:p.x,y:H,textAnchor:"middle",fontSize:8,fill:T.muted},p.label)
      )
    )
  );
}

function BarChart({data,dataKey,color,height=100}){
  const vals=data.map(d=>d[dataKey]);
  const max=Math.max(...vals)||1;
  const W=300,H=height,pad=8,bw=Math.min(20,(W-pad*2)/data.length-3);
  return h("div",{style:{overflowX:"auto"}},
    h("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:H}},
      data.map((d,i)=>{
        const x=pad+(i/data.length)*(W-pad*2)+bw*0.3;
        const bh=((d[dataKey]||0)/max)*(H-20);
        return h("g",{key:i},
          h("rect",{x,y:H-16-bh,width:bw,height:bh,fill:color,rx:3}),
          (i%Math.ceil(data.length/5)===0||i===data.length-1)&&
            h("text",{x:x+bw/2,y:H,textAnchor:"middle",fontSize:8,fill:T.muted},d.label)
        );
      })
    )
  );
}

/* ── UI ── */
const card=(x={})=>({background:T.white,border:`1px solid ${T.border}`,borderRadius:16,padding:16,...x});
const MetCard=({value,unit,label,sub,badge,bColor=T.orange,bBg})=>
  h("div",{style:card()},
    h("div",{style:{display:"flex",alignItems:"baseline",gap:4,marginBottom:6}},
      h("span",{className:"syne",style:{fontSize:34,color:T.text,lineHeight:1}},value),
      unit&&h("span",{style:{fontSize:12,color:T.muted}},unit)
    ),
    h("div",{style:{fontSize:13,fontWeight:600,marginBottom:3}},label),
    sub&&h("div",{style:{fontSize:11,color:T.muted}},sub),
    badge&&h("div",{style:{display:"inline-block",marginTop:8,padding:"3px 10px",borderRadius:100,
      background:bBg||bColor+"18",color:bColor,fontSize:10,fontWeight:700}},badge)
  );
const Sec=({children})=>h("div",{className:"syne",style:{fontSize:11,color:T.muted,
  letterSpacing:2,textTransform:"uppercase",padding:"24px 0 10px"}},children);

/* ── LOADING SCREEN ── */
function Splash({msg}){
  return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",background:T.bg,gap:16}},
    h("div",{style:{fontSize:48}},"🏃"),
    h("div",{className:"syne",style:{fontSize:20,color:T.text}},"Strava Performance"),
    h("div",{style:{fontSize:13,color:T.muted}},msg||"Carregando..."),
    h("div",{style:{width:40,height:3,background:T.orange,borderRadius:3,
      animation:"none",marginTop:8}})
  );
}

/* ── APP ── */
function App(){
  const[tokens,setTokens]=useState(()=>ls.get("s_tok"));
  const[athlete,setAthlete]=useState(null);
  const[acts,setActs]=useState([]);
  const[stats,setStats]=useState(null);
  const[loading,setLoading]=useState(true);
  const[status,setStatus]=useState("Iniciando...");
  const[error,setError]=useState("");

  /* TOKEN MANAGEMENT */
  const refreshToken=async(rt)=>{
    const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({client_id:CLIENT_ID,client_secret:CLIENT_SEC,
        refresh_token:rt,grant_type:"refresh_token"})});
    const d=await r.json();
    if(d.access_token){ls.set("s_tok",d);setTokens(d);return d.access_token;}
    throw new Error("Falha ao renovar token");
  };

  const getToken=async(tok)=>{
    const t=tok||tokens;
    if(!t)return null;
    if(Date.now()/1000<(t.expires_at||0)-60)return t.access_token;
    return refreshToken(t.refresh_token);
  };

  const api=async(path,tok)=>{
    const t=await getToken(tok);
    if(!t)throw new Error("sem token");
    const r=await fetch(SAPI+path,{headers:{Authorization:`Bearer ${t}`}});
    if(!r.ok)throw new Error(`Erro ${r.status}`);
    return r.json();
  };

  /* LOAD DATA */
  const loadData=async(tok)=>{
    setStatus("Carregando seus treinos...");
    const[ath,activities]=await Promise.all([
      api("/athlete",tok),
      api("/athlete/activities?per_page=200",tok)
    ]);
    setAthlete(ath);setActs(activities);
    setStatus("Calculando métricas...");
    const st=await api(`/athletes/${ath.id}/stats`,tok);
    setStats(st);
  };

  /* INIT — runs on mount */
  useEffect(()=>{
    (async()=>{
      // 1. Handle OAuth callback
      const p=new URLSearchParams(window.location.search);
      const code=p.get("code");
      if(code){
        window.history.replaceState({},"",window.location.pathname);
        setStatus("Autorizando com o Strava...");
        try{
          const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({client_id:CLIENT_ID,client_secret:CLIENT_SEC,
              code,grant_type:"authorization_code"})});
          const d=await r.json();
          if(!d.access_token)throw new Error(d.message||"Token inválido");
          ls.set("s_tok",d);setTokens(d);
          await loadData(d);
          setLoading(false);
          return;
        }catch(e){setError(e.message);setLoading(false);return;}
      }

      // 2. Have saved token → use it
      const saved=ls.get("s_tok");
      if(saved){
        setStatus("Conectando ao Strava...");
        try{
          await loadData(saved);
          setLoading(false);
          return;
        }catch(e){
          // Token broken → re-auth silently
          ls.del("s_tok");
        }
      }

      // 3. No token → redirect to Strava automatically
      setStatus("Redirecionando para o Strava...");
      await new Promise(r=>setTimeout(r,800));
      window.location.href=`${SAUTH}?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT)}&response_type=code&approval_prompt=auto&scope=read,activity:read_all`;
    })();
  },[]);

  const dash=useMemo(()=>computeDash(acts,stats),[acts,stats]);
  const weekDays=useMemo(()=>getWeek(acts),[acts]);
  const heatmap=useMemo(()=>buildHeatmap(acts),[acts]);

  /* LOADING */
  if(loading&&!error)return h(Splash,{msg:status});

  /* ERROR */
  if(error)return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",padding:24,gap:16}},
    h("div",{style:{fontSize:40}},"⚠️"),
    h("div",{className:"syne",style:{fontSize:18}},"Erro de conexão"),
    h("div",{style:{fontSize:13,color:T.muted,textAlign:"center"}},error),
    h("button",{onClick:()=>{ls.del("s_tok");window.location.reload();},
      style:{background:T.orange,border:"none",borderRadius:10,padding:"12px 24px",
        color:"#fff",fontSize:14,fontWeight:700,marginTop:8}},
      "Tentar novamente")
  );

  /* MAIN DASHBOARD */
  return h("div",{style:{background:T.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",paddingBottom:40}},

    /* HEADER */
    h("div",{style:{background:T.white,borderBottom:`1px solid ${T.border}`,
      padding:"16px 20px",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between"}},
        h("div",null,
          h("div",{className:"syne",style:{fontSize:17}},
            athlete?`${athlete.firstname} ${athlete.lastname}`:"—"),
          h("div",{style:{fontSize:11,color:T.muted,marginTop:1}},
            "Strava · Dashboard de Performance")
        ),
        h("div",{style:{fontSize:10,color:T.muted,textAlign:"right"}},
          new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}),
          h("br"),
          h("span",{style:{color:T.green,fontWeight:600}},
            athlete?"● Conectado":"—")
        )
      )
    ),

    h("div",{style:{padding:"0 16px"}},

      /* STREAK */
      dash&&h("div",{style:{background:`linear-gradient(135deg,${T.orange},#FF6B35)`,
        borderRadius:16,padding:"20px 18px",marginTop:16,color:"#fff",
        position:"relative",overflow:"hidden"}},
        h("div",{style:{position:"absolute",right:-16,top:-16,fontSize:72,opacity:0.15}},"🔥"),
        h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:4}},
          h("span",{style:{fontSize:22}},"🔥"),
          h("div",{className:"syne",style:{fontSize:20}},`${dash.streak} semanas consecutivas`)
        ),
        h("div",{style:{fontSize:12,opacity:0.85,marginBottom:12}},
          `Meta de 52 semanas — ${Math.round(dash.streak/52*100)}% concluído`),
        h("div",{style:{background:"rgba(255,255,255,0.25)",borderRadius:100,height:6,marginBottom:6}},
          h("div",{style:{background:"#fff",borderRadius:100,height:6,
            width:`${Math.min(dash.streak/52*100,100)}%`}})
        ),
        h("div",{style:{fontSize:11,opacity:0.8}},`${52-dash.streak} semanas restantes`)
      ),

      /* METRICS */
      dash&&h(React.Fragment,null,
        h(Sec,null,"Métricas · Últimos 6 meses"),
        h("div",{style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}},
          h(MetCard,{value:dash.totalKm,unit:"km",label:"Total de km",
            sub:`em ${dash.runCount} corridas`,badge:"+93% vs nov/25",bColor:T.green,bBg:T.greenL}),
          h(MetCard,{value:dash.bestPace,unit:"min/km",label:"Melhor Ritmo (PR)",
            sub:dash.bestPaceDate,badge:"🏅 RP no segmento"}),
          h(MetCard,{value:dash.paceEvo<0?`−${Math.abs(dash.paceEvo).toFixed(2).replace(".",":")}`:"+"+dash.paceEvo.toFixed(2).replace(".",":"),
            unit:"min/km",label:"Evolução de Pace",sub:"em 6 meses",
            badge:dash.paceEvo<0?"↑ Acima da média":"→ Em progresso",
            bColor:dash.paceEvo<0?T.green:"#CA8A04",bBg:dash.paceEvo<0?T.greenL:"#FEFCE8"}),
          dash.avgHR&&h(MetCard,{value:dash.avgHR,unit:"bpm",label:"FC Média",
            sub:"semana atual",badge:"Zona aeróbica",bColor:T.blue,bBg:T.blueL}),
          h(MetCard,{value:dash.weekEffort||"—",label:"Esforço Relativo",
            sub:"esta semana",badge:"Treinamento consistente",bColor:T.purple,bBg:T.purpleL}),
          h(MetCard,{value:dash.biggestKm,unit:"km",label:"Maior Corrida",
            sub:dash.biggestMonth,badge:"Distância pessoal"})
        )
      ),

      /* INSIGHT */
      dash&&h("div",{style:{background:"linear-gradient(135deg,#1C1C1E,#2D2D30)",borderRadius:16,
        padding:"18px 16px",marginTop:8,color:"#fff"}},
        h("div",{style:{display:"flex",alignItems:"center",gap:6,marginBottom:8}},
          h("span",{style:{fontSize:16}},"📈"),
          h("span",{className:"syne",style:{fontSize:11,color:"rgba(255,255,255,0.5)",letterSpacing:2}},
            "ANÁLISE DE EVOLUÇÃO")
        ),
        h("div",{style:{fontSize:14,lineHeight:1.7}},
          h("strong",{style:{color:T.orange}},`Melhora: ${dash.firstPaceStr}/km → ${dash.lastPaceStr}/km`),
          h("br"),
          h("span",{style:{opacity:0.8,fontSize:13}},
            "Quase 2 min/km em 5 meses — evolução acima da curva. Próximo alvo: ",
            h("strong",{style:{color:"#60D394"}},"8:00/km"))
        )
      ),

      /* CHARTS */
      dash&&dash.monthlyData&&h(React.Fragment,null,
        h(Sec,null,"Evolução ao Longo do Tempo"),
        h("div",{style:{display:"grid",gap:12}},
          h("div",{style:card()},
            h("div",{style:{fontSize:12,fontWeight:600,marginBottom:2}},"Ritmo Médio por Mês"),
            h("div",{style:{fontSize:10,color:T.muted,marginBottom:10}},"min/km — menor = mais rápido"),
            h(LineChart,{data:dash.monthlyData,dataKey:"pace",color:T.orange,height:110})
          ),
          h("div",{style:card()},
            h("div",{style:{fontSize:12,fontWeight:600,marginBottom:2}},"Volume Mensal (km)"),
            h("div",{style:{fontSize:10,color:T.muted,marginBottom:10}},"Distância total por mês"),
            h(BarChart,{data:dash.monthlyData,dataKey:"km",color:T.orange,height:100})
          ),
          h("div",{style:card()},
            h("div",{style:{fontSize:12,fontWeight:600,marginBottom:2}},"Frequência de Corridas"),
            h("div",{style:{fontSize:10,color:T.muted,marginBottom:10}},"Número de corridas por mês"),
            h(BarChart,{data:dash.monthlyData,dataKey:"corridas",color:"#18181B",height:90})
          ),
          h("div",{style:card()},
            h("div",{style:{fontSize:12,fontWeight:600,marginBottom:2}},"FC Média por Mês"),
            h("div",{style:{fontSize:10,color:T.muted,marginBottom:10}},"Adaptação cardiovascular"),
            h(LineChart,{data:dash.monthlyData.filter(m=>m.hr),dataKey:"hr",color:T.blue,height:110})
          )
        )
      ),

      /* CURRENT WEEK */
      h(Sec,null,"Semana Atual"),
      h("div",{style:{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}},
        weekDays.map(({date,acts:dActs},i)=>{
          const runAct=dActs.find(a=>isRun(a.type));
          const gymAct=dActs.find(a=>isGym(a.type));
          const isRest=dActs.length===0;
          return h("div",{key:i,style:{background:T.white,
            border:`1px solid ${runAct?T.orange:T.border}`,
            borderRadius:12,padding:"8px 6px",textAlign:"center",minHeight:88}},
            h("div",{style:{fontSize:9,fontWeight:700,
              color:runAct?T.orange:T.muted,letterSpacing:0.5}},DAYS[date.getDay()]),
            h("div",{style:{fontSize:8,color:T.muted,marginBottom:5}},
              `${String(date.getDate()).padStart(2,"0")}/${String(date.getMonth()+1).padStart(2,"0")}`),
            runAct&&h(React.Fragment,null,
              h("div",{style:{fontSize:18,marginBottom:2}},"🏃"),
              h("div",{style:{fontSize:9,fontWeight:700}},(runAct.distance/1000).toFixed(1)+" km"),
              h("div",{style:{fontSize:8,color:T.orange}},pace(runAct.average_speed)+"/km"),
              runAct.has_heartrate&&h("div",{style:{fontSize:8,color:T.muted}},
                Math.round(runAct.average_heartrate)+"bpm")
            ),
            !runAct&&gymAct&&h(React.Fragment,null,
              h("div",{style:{fontSize:18,marginBottom:2}},"🏋️"),
              h("div",{style:{fontSize:9,color:T.muted}},"Musculação")
            ),
            isRest&&h(React.Fragment,null,
              h("div",{style:{fontSize:18,marginBottom:2}},"😴"),
              h("div",{style:{fontSize:8,color:T.muted}},"Descanso")
            )
          );
        })
      ),

      /* HEATMAP */
      h(Sec,null,"Mapa de Consistência"),
      h("div",{style:card()},
        h("div",{style:{fontSize:11,color:T.muted,marginBottom:10}},"Atividades diárias · nov/25 – hoje"),
        h("div",{style:{overflowX:"auto"}},
          h("div",{style:{display:"flex",gap:3,minWidth:"max-content"}},
            heatmap.map((week,wi)=>
              h("div",{key:wi,style:{display:"flex",flexDirection:"column",gap:3}},
                week.map((day,di)=>{
                  const hasRun=day.types.some(t=>isRun(t));
                  const hasGym=day.types.some(t=>isGym(t));
                  return h("div",{key:di,title:day.key,style:{width:9,height:9,borderRadius:2,
                    background:hasRun?T.orange:hasGym?"#D4D4D8":T.border,
                    opacity:day.types.length===0?0.35:1}});
                })
              )
            )
          )
        ),
        h("div",{style:{display:"flex",gap:14,marginTop:10}},
          [{c:T.orange,l:"Corrida"},{c:"#D4D4D8",l:"Musculação"},{c:T.border,o:0.35,l:"Descanso"}]
          .map(({c,l,o=1})=>h("div",{key:l,style:{display:"flex",alignItems:"center",gap:5}},
            h("div",{style:{width:9,height:9,borderRadius:2,background:c,opacity:o}}),
            h("span",{style:{fontSize:10,color:T.muted}},l)
          ))
        )
      ),

      /* INSTALL HINT */
      h("div",{style:{marginTop:14,padding:"12px 14px",background:T.bg,
        border:`1px dashed ${T.border}`,borderRadius:12,fontSize:11,color:T.muted,textAlign:"center"}},
        "📱 Safari → Compartilhar → ",h("strong",null,"Adicionar à Tela de Início")
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
</body>
</html>
