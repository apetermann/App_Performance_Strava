<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ── CONFIG ───────────────────────────────────────────────────────────────────
const CID  = "235154";
const CS   = "503e9c222e53cac459e0788ddac6f23ef692e1a2";
const REDIR = window.location.origin + window.location.pathname;
const STOK  = "https://www.strava.com/oauth/token";
const SAUTH = "https://www.strava.com/oauth/authorize";
const SAPI  = "https://www.strava.com/api/v3";

// ── THEME ────────────────────────────────────────────────────────────────────
const OR = "#FC4C02", GR = "#00C896", BL = "#3B82F6";
const BG = "#0C0C0C", CARD = "#171717", CARD2 = "#1F1F1F", BORD = "#282828";
const MUT = "#5A5A5A", TXT = "#F0F0F0";
const ZONES_COLORS = ["#FECACA","#FCA5A5","#F87171","#EF4444","#B91C1C"];
const DEFAULT_ZONES = [{min:0,max:115},{min:115,max:152},{min:152,max:171},{min:171,max:190},{min:190,max:-1}];

// ── UTILS ────────────────────────────────────────────────────────────────────
const ls = {
  get: k => { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem(k, JSON.stringify(v)),
  del: k => localStorage.removeItem(k),
};
const isRun = t => ["Run","TrailRun","VirtualRun"].includes(t);
const isGym = t => ["WeightTraining","Yoga","Workout"].includes(t);
const fmtPace = ms => { if (!ms) return "--"; const s=1000/ms; return `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`; };
const paceNum = ms => ms ? +(1000/ms/60).toFixed(2) : null;
const paceStr = n => { const m=Math.floor(n), s=Math.round((n-m)*60); return `${m}:${String(s).padStart(2,"0")}`; };
const fmtMon  = d => new Date(d).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
const fmtDate = d => new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const DAYS = ["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];

// ── STRAVA API ────────────────────────────────────────────────────────────────
async function stravaGet(path, token) {
  let tok = token;
  if (Date.now()/1000 >= (tok.expires_at||0) - 60) {
    const r = await fetch(STOK, { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({client_id:CID,client_secret:CS,refresh_token:tok.refresh_token,grant_type:"refresh_token"}) });
    const d = await r.json();
    if (!d.access_token) throw new Error("Sessão expirada — reconecte");
    ls.set("s_tok", d);
    tok = d;
  }
  const r = await fetch(SAPI+path, { headers:{Authorization:`Bearer ${tok.access_token}`} });
  if (!r.ok) throw new Error(`Strava ${r.status}`);
  return r.json();
}

async function loadData(token) {
  const athlete   = await stravaGet("/athlete", token);
  const acts      = await stravaGet("/athlete/activities?per_page=200", token);
  const stats     = await stravaGet(`/athletes/${athlete.id}/stats`, token).catch(() => null);
  const zonesResp = await stravaGet("/athlete/zones", token).catch(() => null);
  const zones     = zonesResp?.heart_rate?.zones || DEFAULT_ZONES;
  return { athlete, acts, stats, zones };
}

// ── WEEK HELPERS ──────────────────────────────────────────────────────────────
function weekBounds(offset) {
  const now = new Date();
  const dow = (now.getDay()+6)%7;
  const mon = new Date(now); mon.setDate(now.getDate()-dow-offset*7); mon.setHours(0,0,0,0);
  const sun = new Date(mon); sun.setDate(mon.getDate()+6); sun.setHours(23,59,59,999);
  return { mon, sun };
}
function filterWeek(acts, offset) {
  const { mon, sun } = weekBounds(offset);
  return acts.filter(a => { const d=new Date(a.start_date); return d>=mon && d<=sun; });
}
function weekDays(acts, offset) {
  const { mon } = weekBounds(offset);
  return Array.from({length:7}, (_,i) => {
    const d = new Date(mon); d.setDate(d.getDate()+i);
    const k = d.toISOString().split("T")[0];
    return { date:d, acts: acts.filter(a => a.start_date.startsWith(k)) };
  });
}
function weekLabel(offset) {
  const { mon, sun } = weekBounds(offset);
  const f = d => d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  return `${f(mon)} – ${f(sun)} ${sun.getFullYear()}`;
}
function calcStreak(acts) {
  const runs = acts.filter(a => isRun(a.type));
  let streak = 0;
  const now = new Date();
  let ws = new Date(now); ws.setDate(ws.getDate()-((ws.getDay()+6)%7)); ws.setHours(0,0,0,0);
  for (let i=0; i<60; i++) {
    const we = new Date(ws); we.setDate(we.getDate()+7);
    if (!runs.some(r => { const d=new Date(r.start_date); return d>=ws && d<we; })) break;
    streak++; ws.setDate(ws.getDate()-7);
  }
  return streak;
}
function buildMonthly(acts) {
  const map = {};
  acts.filter(a => isRun(a.type)).forEach(r => {
    const k = fmtMon(r.start_date);
    if (!map[k]) map[k] = {label:k,km:0,runs:0,pSum:0,hrSum:0,hrN:0,ts:new Date(r.start_date).getTime()};
    map[k].km += r.distance/1000; map[k].runs++;
    map[k].pSum += paceNum(r.average_speed)||0;
    if (r.has_heartrate && r.average_heartrate) { map[k].hrSum += r.average_heartrate; map[k].hrN++; }
  });
  return Object.values(map).sort((a,b)=>a.ts-b.ts).map(m => ({
    label:m.label, km:+m.km.toFixed(1), corridas:m.runs,
    pace:+(m.pSum/Math.max(m.runs,1)).toFixed(2),
    hr: m.hrN ? Math.round(m.hrSum/m.hrN) : null
  }));
}

// ── HR ZONES ESTIMATE ─────────────────────────────────────────────────────────
function estimateZones(acts, ranges) {
  let total = 0; const zSec = ranges.map(()=>0);
  acts.forEach(a => {
    const dur = a.moving_time||0; if (!dur) return;
    let dist;
    if (isGym(a.type)) { dist=[0.75,0.18,0.05,0.02,0.00]; }
    else if (a.has_heartrate && a.average_heartrate) {
      const avg=a.average_heartrate, sig=15;
      const phi = x => 0.5*(1+Math.tanh(x/1.4142));
      const raw = ranges.map(({min,max}) => {
        const hi = max===-1 ? avg+50 : max;
        return Math.max(0, phi((hi-avg)/sig) - phi((min-avg)/sig));
      });
      const s = raw.reduce((a,b)=>a+b,0)||1;
      dist = raw.map(v=>v/s);
    } else return;
    total += dur;
    dist.forEach((p,i) => { if(i<zSec.length) zSec[i]+=dur*p; });
  });
  if (!total) return null;
  const s = zSec.reduce((a,b)=>a+b,0)||1;
  return zSec.map(v => Math.round(v/s*100));
}

// ── COACH ANALYSIS ────────────────────────────────────────────────────────────
function analyzeWeek(wActs, pActs, isCurrent) {
  const wr = wActs.filter(a=>isRun(a.type));
  const pr = pActs.filter(a=>isRun(a.type));
  const wkm = wr.reduce((s,r)=>s+r.distance/1000,0);
  const pkm = pr.reduce((s,r)=>s+r.distance/1000,0);
  const wsp = wr.length ? wr.reduce((s,r)=>s+(r.average_speed||0),0)/wr.length : 0;
  const psp = pr.length ? pr.reduce((s,r)=>s+(r.average_speed||0),0)/pr.length : 0;
  const hrr = wr.filter(r=>r.has_heartrate&&r.average_heartrate);
  const avgHR = hrr.length ? Math.round(hrr.reduce((s,r)=>s+r.average_heartrate,0)/hrr.length) : null;
  const effort = wr.reduce((s,r)=>s+(r.suffer_score||0),0);
  const chg = pkm>0 ? (wkm-pkm)/pkm*100 : null;
  const pcChg = wsp>0&&psp>0 ? paceNum(wsp)-paceNum(psp) : null;

  if (!wr.length) return {
    headline: isCurrent ? "Nenhuma corrida ainda esta semana" : "Semana sem corridas",
    points: [isCurrent ? "Semana em andamento ou de descanso ativo. O descanso faz parte do plano." : "Semana de descanso. O corpo também evolui quando recupera."],
    conclusion: ""
  };

  const pts = [];
  if (chg !== null) pts.push(`${chg>=0?"📈":"📉"} Volume ${chg>=0?"acima":"abaixo"} da semana anterior — ${Math.abs(chg).toFixed(0)}% (${pkm.toFixed(1)} → ${wkm.toFixed(1)} km). ${chg>15?"Progressão alta — monitore sinais de fadiga.":chg<-25?"Volume reduzido. Se foi intencional, ótimo.":"Progressão dentro do limite seguro de 10%."}`);
  if (wsp>0) pts.push(psp>0
    ? (pcChg<-0.05 ? `⚡ Ritmo melhorou — ${fmtPace(wsp)}/km vs ${fmtPace(psp)}/km. Adaptação positiva.` : `🧘 Ritmo conservador — ${fmtPace(wsp)}/km vs ${fmtPace(psp)}/km. Pode indicar fadiga ou treino de recuperação.`)
    : `⚡ Ritmo médio: ${fmtPace(wsp)}/km.`);
  if (avgHR) {
    const z = avgHR<115?"Z1 (recuperação)":avgHR<152?"Z2 (aeróbico base)":avgHR<171?"Z3 (intenso)":"Z4+ (limiar/máximo)";
    pts.push(`❤️ FC média: ${avgHR} bpm (${z}). ${avgHR<152?"Ideal para construção de base aeróbica.":"Alta intensidade — garanta recuperação adequada."}`);
  }
  if (effort>0) pts.push(`🔥 Esforço relativo: ${effort} pts — ${effort>150?"semana de alta carga.":effort>80?"carga moderada.":"carga leve."}`);

  const conc = isCurrent
    ? (wr.length>=3 ? "Frequência consistente esta semana. Continue." : "Adicione pelo menos mais uma corrida para manter o ritmo.")
    : (pcChg&&pcChg<-0.1 ? "Semana com evolução de ritmo — sinal de adaptação cardiovascular." : "Semana sólida de construção de base.");

  return {
    headline: `${wr.length} corrida${wr.length>1?"s":""} · ${wkm.toFixed(1)} km${chg!=null?" ("+(chg>=0?"+":"")+chg.toFixed(0)+"% vs ant.)":""}`,
    points: pts, conclusion: conc
  };
}

function analyzeSix(monthly, totalKm, count, streak, maxKm) {
  if (!monthly || monthly.length < 2) return null;
  const f=monthly[0], l=monthly[monthly.length-1];
  const imp = f.pace-l.pace;
  const impStr = `${Math.floor(imp)}:${String(Math.round((imp%1)*60)).padStart(2,"0")}`;
  const vChg = f.km>0 ? ((l.km-f.km)/f.km*100) : 0;
  const best = [...monthly].sort((a,b)=>b.km-a.km)[0];
  return {
    intro: `O número mais importante: seu ritmo saiu de ${paceStr(f.pace)}/km em ${f.label} para ${paceStr(l.pace)}/km em ${l.label} — ${impStr} de melhora em ${monthly.length} meses. Para um iniciante, isso é acima da curva.`,
    points: [
      { icon:"🔥", title:"Consistência fora do normal", text:`${streak} semanas consecutivas sem uma semana em branco. Isso é o que separa atletas que evoluem dos que ficam estagnados.` },
      { icon:"📈", title:"Volume crescendo com qualidade", text:`De ${f.km.toFixed(0)} km em ${f.label} para ${l.km.toFixed(0)} km em ${l.label} (${vChg>0?"+":""}${vChg.toFixed(0)}%). Melhor mês: ${best.label} com ${best.km.toFixed(1)} km.` },
      { icon:"🎯", title:"Próximo passo está claro", text:`Maior corrida: ${maxKm} km. Adicione uma corrida longa semanal — começa com ${Math.ceil(maxKm)+1} km aos sábados. Um 10K até agosto é totalmente factível.` }
    ],
    conclusion: `Com ${totalKm} km em ${count} corridas, a base está sólida. Meta: ${paceStr(l.pace-0.2)}/km nos próximos 60 dias.`
  };
}

// ── SVG CHARTS ────────────────────────────────────────────────────────────────
function LineChart({ data, dKey, color, height=115, reversed=false }) {
  const pts = data.filter(d => d[dKey] != null);
  if (pts.length < 2) return null;
  const vals = pts.map(d => d[dKey]);
  const mn=Math.min(...vals), mx=Math.max(...vals), rng=mx-mn||1;
  const W=300, P=8, IH=height-16;
  const mapped = pts.map((d,i) => ({
    x: P+(i/(pts.length-1))*(W-P*2),
    y: reversed ? P+((d[dKey]-mn)/rng)*IH : IH+P-((d[dKey]-mn)/rng)*IH,
    l: d.label
  }));
  const path = mapped.map((p,i) => `${i?"L":"M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const area = path + ` L${mapped[mapped.length-1].x.toFixed(1)},${IH+P} L${mapped[0].x.toFixed(1)},${IH+P} Z`;
  const gid = `g${dKey}${color.replace("#","")}`;
  const step = Math.max(1, Math.ceil(mapped.length/5));
  return (
    <svg viewBox={`0 0 ${W} ${height}`} style={{width:"100%",height}}>
      <defs>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.2"/>
          <stop offset="100%" stopColor={color} stopOpacity="0"/>
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`}/>
      <path d={path} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
      {mapped.map((p,i) => <circle key={i} cx={p.x} cy={p.y} r="3" fill={color}/>)}
      {mapped.filter((_,i) => i%step===0 || i===mapped.length-1).map((p,i) =>
        <text key={i} x={p.x} y={height} textAnchor="middle" fontSize="9" fill={MUT}>{p.l}</text>
      )}
    </svg>
  );
}

function BarChart({ data, dKey, color, height=95 }) {
  const vals = data.map(d => d[dKey]||0);
  const mx = Math.max(...vals, 1);
  const W=300, P=8, n=data.length, bw=Math.min(22,(W-P*2)/n-3);
  const step = Math.max(1, Math.ceil(n/5));
  return (
    <svg viewBox={`0 0 ${W} ${height}`} style={{width:"100%",height}}>
      {data.map((d,i) => {
        const x=P+(i/n)*(W-P*2)+bw*0.2, bh=((d[dKey]||0)/mx)*(height-16);
        return (
          <g key={i}>
            <rect x={x} y={height-14-bh} width={bw} height={Math.max(bh,1)} fill={color} rx="3" opacity="0.9"/>
            {(i%step===0 || i===n-1) && <text x={x+bw/2} y={height} textAnchor="middle" fontSize="9" fill={MUT}>{d.label}</text>}
          </g>
        );
      })}
    </svg>
  );
}

function ZonesChart({ pct, ranges }) {
  if (!pct) return <p style={{color:MUT,fontSize:12,padding:"8px 0"}}>Dados insuficientes para zonas.</p>;
  const labels = ranges.map(({min,max},i) => max===-1?`>${min}`:i===0?`<${max}`:`${min}–${max}`);
  const top = pct.indexOf(Math.max(...pct));
  return (
    <div>
      <div style={{fontSize:13,fontWeight:600,marginBottom:10}}>
        {pct[top]}% em Zona {top+1}&nbsp;
        <span style={{fontSize:11,color:MUT,fontWeight:400}}>({labels[top]} bpm)</span>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:7}}>
        {[4,3,2,1,0].map(i => (
          <div key={i} style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{width:20,fontSize:11,color:MUT,fontWeight:700}}>Z{i+1}</div>
            <div style={{flex:1,background:"#222",borderRadius:4,height:16,overflow:"hidden"}}>
              <div style={{width:`${Math.max(pct[i],1)}%`,height:"100%",background:ZONES_COLORS[i],borderRadius:4}}/>
            </div>
            <div style={{width:30,fontSize:12,fontWeight:700,color:ZONES_COLORS[i],textAlign:"right"}}>{pct[i]}%</div>
            <div style={{width:72,fontSize:9,color:MUT,textAlign:"right"}}>{labels[i]} bpm</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── UI COMPONENTS ─────────────────────────────────────────────────────────────
const card = { background:CARD, border:`1px solid ${BORD}`, borderRadius:14 };

function StatBox({ val, label, color=TXT, sub }) {
  return (
    <div style={{...card,padding:"14px 12px",textAlign:"center"}}>
      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:28,color,lineHeight:1.1}}>{val}</div>
      <div style={{fontSize:10,color:MUT,marginTop:4,textTransform:"uppercase",letterSpacing:1}}>{label}</div>
      {sub && <div style={{fontSize:10,color:MUT,marginTop:2}}>{sub}</div>}
    </div>
  );
}

function AnalCard({ data }) {
  if (!data) return null;
  return (
    <div style={{...card,padding:16,borderLeft:`3px solid ${OR}`}}>
      {data.intro && <p style={{fontSize:13,lineHeight:1.75,color:TXT,marginBottom:12}}>{data.intro}</p>}
      {data.points && (
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {data.points.map((p,i) => (
            <div key={i}>
              {typeof p==="string"
                ? <p style={{fontSize:12,color:"#CCC",lineHeight:1.65}}>{p}</p>
                : <>
                    <p style={{fontSize:12,fontWeight:700,color:OR,marginBottom:2}}>{p.icon} {p.title}</p>
                    <p style={{fontSize:12,color:"#CCC",lineHeight:1.65}}>{p.text}</p>
                  </>
              }
            </div>
          ))}
        </div>
      )}
      {data.conclusion && (
        <p style={{fontSize:12,color:GR,marginTop:10,paddingTop:10,borderTop:`1px solid ${BORD}`,fontWeight:600}}>
          → {data.conclusion}
        </p>
      )}
    </div>
  );
}

function Sec({ children }) {
  return <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:10,color:MUT,letterSpacing:2,textTransform:"uppercase",margin:"20px 0 10px"}}>{children}</div>;
}

function DayGrid({ days }) {
  return (
    <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:5}}>
      {days.map(({date,acts},i) => {
        const run = acts.find(a=>isRun(a.type));
        const gym = acts.find(a=>isGym(a.type));
        const bd  = run ? OR : gym ? BL : BORD;
        const isPR = run && run.suffer_score > 85;
        return (
          <div key={i} style={{background:CARD2,border:`2px solid ${bd}`,borderRadius:12,padding:"7px 3px",textAlign:"center",minHeight:95}}>
            <div style={{fontSize:9,fontWeight:700,color:run?OR:gym?BL:MUT,letterSpacing:0.5}}>{DAYS[date.getDay()]}</div>
            <div style={{fontSize:8,color:MUT,marginBottom:4}}>{String(date.getDate()).padStart(2,"0")}/{String(date.getMonth()+1).padStart(2,"0")}</div>
            {run ? (
              <>
                <div style={{fontSize:18,marginBottom:1}}>🏃</div>
                <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:13,lineHeight:1}}>{(run.distance/1000).toFixed(1)}</div>
                <div style={{fontSize:8,color:MUT}}>km</div>
                <div style={{fontSize:8,color:OR,margin:"2px 0"}}>{fmtPace(run.average_speed)}/km</div>
                {run.has_heartrate && <div style={{fontSize:8,color:MUT}}>{Math.round(run.average_heartrate)}bpm</div>}
                {isPR && <div style={{marginTop:3,display:"inline-block",padding:"2px 5px",borderRadius:100,background:OR,color:"#fff",fontSize:7,fontWeight:700}}>🏅 RP</div>}
              </>
            ) : gym ? (
              <>
                <div style={{fontSize:18,marginBottom:4}}>🏋️</div>
                <div style={{fontSize:9,color:MUT}}>Musculação</div>
              </>
            ) : (
              <>
                <div style={{fontSize:18,marginBottom:4}}>😴</div>
                <div style={{fontSize:9,color:MUT}}>Descanso</div>
              </>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ── WEEK VIEW ─────────────────────────────────────────────────────────────────
function WeekView({ acts, offset, zones }) {
  const wa   = useMemo(() => filterWeek(acts, offset), [acts, offset]);
  const pa   = useMemo(() => filterWeek(acts, offset+1), [acts, offset]);
  const days = useMemo(() => weekDays(acts, offset), [acts, offset]);
  const runs = wa.filter(a => isRun(a.type));
  const tkm  = runs.reduce((s,r)=>s+r.distance/1000, 0);
  const pkm  = pa.filter(a=>isRun(a.type)).reduce((s,r)=>s+r.distance/1000, 0);
  const asp  = runs.length ? runs.reduce((s,r)=>s+(r.average_speed||0),0)/runs.length : 0;
  const hrr  = runs.filter(r=>r.has_heartrate&&r.average_heartrate);
  const avgHR = hrr.length ? Math.round(hrr.reduce((s,r)=>s+r.average_heartrate,0)/hrr.length) : null;
  const chg  = pkm>0 ? (tkm-pkm)/pkm*100 : null;
  const anal = useMemo(() => analyzeWeek(wa, pa, offset===0), [wa, pa, offset]);
  const zpct = useMemo(() => estimateZones(wa, zones), [wa, zones]);
  const paceData = runs.slice().reverse().map(r => ({label:fmtDate(r.start_date), pace:paceNum(r.average_speed)}));

  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:4}}>
        <StatBox val={tkm.toFixed(1)} label="km total" color={OR} sub={chg!=null?`${chg>=0?"+":""}${chg.toFixed(0)}% vs ant.`:null}/>
        <StatBox val={asp>0?fmtPace(asp):"--"} label="pace médio"/>
        <StatBox val={runs.length} label="corridas"/>
        <StatBox val={avgHR||"--"} label="fc média bpm" color={avgHR?BL:MUT}/>
      </div>
      <Sec>Análise do Coach</Sec>
      <AnalCard data={anal}/>
      <Sec>Dias da Semana</Sec>
      <DayGrid days={days}/>
      {runs.length > 1 && <>
        <Sec>Pace por Corrida</Sec>
        <div style={{...card,padding:14}}>
          <LineChart data={paceData} dKey="pace" color={OR} reversed={true}/>
          <p style={{fontSize:10,color:MUT,textAlign:"center",marginTop:4}}>menor = mais rápido</p>
        </div>
      </>}
      <Sec>Zonas de Frequência Cardíaca</Sec>
      <div style={{...card,padding:14}}>
        <ZonesChart pct={zpct} ranges={zones}/>
      </div>
    </div>
  );
}

// ── SIX MONTH VIEW ────────────────────────────────────────────────────────────
function SixView({ acts, stats, zones }) {
  const since   = useMemo(() => { const d=new Date(); d.setMonth(d.getMonth()-6); return d; }, []);
  const recent  = useMemo(() => acts.filter(a => new Date(a.start_date)>=since), [acts, since]);
  const runs    = useMemo(() => recent.filter(a=>isRun(a.type)), [recent]);
  const monthly = useMemo(() => buildMonthly(recent), [recent]);
  const streak  = useMemo(() => calcStreak(acts), [acts]);
  const totalKm = Math.round(runs.reduce((s,r)=>s+r.distance/1000, 0));
  const biggest = runs.length ? [...runs].sort((a,b)=>b.distance-a.distance)[0] : null;
  const maxKm   = biggest ? +(biggest.distance/1000).toFixed(1) : 0;
  const avgSp   = runs.length ? runs.reduce((s,r)=>s+(r.average_speed||0),0)/runs.length : 0;
  const anal    = useMemo(() => analyzeSix(monthly,totalKm,runs.length,streak,maxKm), [monthly,totalKm,runs.length,streak,maxKm]);
  const zpct    = useMemo(() => estimateZones(recent, zones), [recent, zones]);

  return (
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:4}}>
        <StatBox val={totalKm} label="km totais" color={OR} sub={`${runs.length} corridas`}/>
        <StatBox val={avgSp>0?fmtPace(avgSp):"--"} label="pace médio"/>
        <StatBox val={streak} label="semanas seguidas" color={OR}/>
        <StatBox val={maxKm} label="maior corrida" sub="km"/>
      </div>
      <div style={{...card,padding:16,background:"rgba(252,76,2,0.1)",border:`1px solid ${OR}44`,marginTop:8}}>
        <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
          <span style={{fontSize:22}}>🔥</span>
          <span style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}}>
            <span style={{color:OR}}>{streak}</span> semanas consecutivas
          </span>
        </div>
        <p style={{fontSize:11,color:MUT,marginBottom:10}}>Meta de 52 semanas — {Math.round(streak/52*100)}% · {52-streak} restantes</p>
        <div style={{background:"#2A2A2A",borderRadius:100,height:6}}>
          <div style={{background:OR,borderRadius:100,height:6,width:`${Math.min(streak/52*100,100)}%`}}/>
        </div>
      </div>
      <Sec>Análise dos 6 Meses</Sec>
      <AnalCard data={anal}/>
      {monthly.length > 1 && <>
        <Sec>Ritmo Médio por Mês</Sec>
        <div style={{...card,padding:14}}>
          <p style={{fontSize:10,color:MUT,marginBottom:8}}>min/km — menor = mais rápido</p>
          <LineChart data={monthly} dKey="pace" color={OR} reversed={true}/>
        </div>
        <Sec>Volume Mensal (km)</Sec>
        <div style={{...card,padding:14}}>
          <BarChart data={monthly} dKey="km" color={OR}/>
        </div>
        <Sec>Frequência de Corridas</Sec>
        <div style={{...card,padding:14}}>
          <BarChart data={monthly} dKey="corridas" color="#666" height={85}/>
        </div>
        {monthly.some(m=>m.hr) && <>
          <Sec>FC Média por Mês</Sec>
          <div style={{...card,padding:14}}>
            <LineChart data={monthly.filter(m=>m.hr)} dKey="hr" color={BL}/>
          </div>
        </>}
      </>}
      <Sec>Zonas de FC · 6 Meses</Sec>
      <div style={{...card,padding:14}}>
        <ZonesChart pct={zpct} ranges={zones}/>
      </div>
    </div>
  );
}

// ── SPLASH ────────────────────────────────────────────────────────────────────
function Splash({ msg }) {
  return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:BG,gap:16}}>
      <div style={{width:68,height:68,background:OR,borderRadius:18,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:34,color:"#fff"}}>S</div>
      <p style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:19,color:TXT}}>Strava Performance</p>
      <p style={{fontSize:13,color:MUT}}>{msg}</p>
      <div style={{width:44,height:3,background:OR,borderRadius:3}}/>
    </div>
  );
}

// ── APP ───────────────────────────────────────────────────────────────────────
function App() {
  const [data,    setData]    = useState(null);
  const [loading, setLoading] = useState(true);
  const [status,  setStatus]  = useState("Iniciando...");
  const [error,   setError]   = useState("");
  const [tab,     setTab]     = useState("atual");
  const [busy,    setBusy]    = useState(false);
  const [updated, setUpdated] = useState(null);

  async function run(token) {
    setStatus("Carregando treinos...");
    const d = await loadData(token);
    setData(d);
    setUpdated(new Date());
  }

  useEffect(() => {
    (async () => {
      try {
        // OAuth callback
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        if (code) {
          window.history.replaceState({}, "", window.location.pathname);
          setStatus("Autorizando...");
          const r = await fetch(STOK, { method:"POST", headers:{"Content-Type":"application/json"},
            body: JSON.stringify({client_id:CID,client_secret:CS,code,grant_type:"authorization_code"}) });
          const d = await r.json();
          if (!d.access_token) throw new Error(d.message || "Token inválido");
          ls.set("s_tok", d);
          await run(d);
          setLoading(false);
          return;
        }
        // Saved token
        const saved = ls.get("s_tok");
        if (saved) {
          setStatus("Conectando...");
          try { await run(saved); setLoading(false); return; }
          catch { ls.del("s_tok"); }
        }
        // Redirect
        setStatus("Abrindo o Strava...");
        await new Promise(r => setTimeout(r, 600));
        window.location.href = `${SAUTH}?client_id=${CID}&redirect_uri=${encodeURIComponent(REDIR)}&response_type=code&approval_prompt=auto&scope=read,activity:read_all`;
      } catch (err) {
        setError(err.message || "Erro desconhecido");
        setLoading(false);
      }
    })();
  }, []);

  async function refresh() {
    setBusy(true);
    try { const t=ls.get("s_tok"); if(t) await run(t); }
    catch (err) { setError(err.message); }
    setBusy(false);
  }

  if (loading && !error) return <Splash msg={status}/>;

  if (error) return (
    <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:24,gap:16,background:BG}}>
      <span style={{fontSize:40}}>⚠️</span>
      <p style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20}}>Erro de conexão</p>
      <p style={{fontSize:13,color:MUT,textAlign:"center",maxWidth:300,lineHeight:1.6}}>{error}</p>
      <button onClick={() => { ls.del("s_tok"); window.location.reload(); }}
        style={{background:OR,border:"none",borderRadius:10,padding:"12px 28px",color:"#fff",fontSize:14,fontWeight:700,cursor:"pointer"}}>
        Reconectar Strava
      </button>
    </div>
  );

  const athlete = data?.athlete;
  const acts    = data?.acts || [];
  const stats   = data?.stats;
  const zones   = data?.zones || DEFAULT_ZONES;
  const upd     = updated ? updated.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}) : "—";
  const TABS    = [["atual","Esta Semana"],["anterior","Semana Ant."],["meses","6 Meses"]];

  return (
    <div style={{background:BG,minHeight:"100vh",maxWidth:430,margin:"0 auto",paddingBottom:44}}>
      {/* HEADER */}
      <div style={{background:"#111",borderBottom:`1px solid ${BORD}`,padding:"14px 18px 12px",position:"sticky",top:0,zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{width:44,height:44,background:OR,borderRadius:12,flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center",fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:"#fff"}}>S</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:16}}>{athlete ? `${athlete.firstname} ${athlete.lastname}` : "—"}</div>
            <div style={{fontSize:11,color:MUT}}>Strava · Dashboard de Performance</div>
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:8,marginTop:10}}>
          <div style={{background:"#1A1A1A",border:`1px solid ${BORD}`,borderRadius:8,padding:"4px 10px",fontSize:11,color:MUT}}>
            Atualizado: <span style={{color:OR,fontWeight:600}}>{upd}</span>
          </div>
          <button onClick={refresh} disabled={busy}
            style={{background:"transparent",border:`1px solid ${busy?"#333":OR}`,borderRadius:8,padding:"4px 12px",color:busy?"#444":OR,fontSize:11,fontWeight:600,cursor:"pointer"}}>
            {busy ? "..." : "⟳ Atualizar dados"}
          </button>
        </div>
        <div style={{display:"flex",gap:4,marginTop:10}}>
          {TABS.map(([k,l]) => (
            <button key={k} onClick={() => setTab(k)}
              style={{flex:1,padding:"7px 0",borderRadius:8,fontSize:11,fontWeight:600,border:"none",cursor:"pointer",background:tab===k?OR:"#1A1A1A",color:tab===k?"#fff":MUT}}>
              {l}
            </button>
          ))}
        </div>
      </div>
      {/* CONTENT */}
      <div style={{padding:"12px 14px 0"}}>
        {tab !== "meses" && <p style={{fontSize:11,color:MUT,marginBottom:8}}>{weekLabel(tab==="atual"?0:1)}</p>}
        {tab === "atual"     && <WeekView acts={acts} offset={0} zones={zones}/>}
        {tab === "anterior"  && <WeekView acts={acts} offset={1} zones={zones}/>}
        {tab === "meses"     && <SixView  acts={acts} stats={stats} zones={zones}/>}
        <div style={{marginTop:18,padding:"10px 14px",background:"#111",border:`1px dashed ${BORD}`,borderRadius:10,fontSize:10,color:MUT,textAlign:"center"}}>
          📱 Safari → Compartilhar → Adicionar à Tela de Início
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
