<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Strava Perf"/>
  <meta name="theme-color" content="#0C0C0C"/>
  <title>Strava Performance</title>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icon.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html,body{background:#0C0C0C;font-family:'Inter',sans-serif;color:#F0F0F0;overscroll-behavior:none;height:100%}
    ::-webkit-scrollbar{display:none}
    .sy{font-family:'Syne',sans-serif;font-weight:800}
    button,input{font-family:inherit;cursor:pointer}
    #app{max-width:430px;margin:0 auto;min-height:100vh}

    /* Splash */
    #splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:16px}
    .s-avatar{width:68px;height:68px;background:#FC4C02;border-radius:18px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:34px;color:#fff}
    .s-bar{width:44px;height:3px;background:#FC4C02;border-radius:3px;margin-top:4px}

    /* Header */
    #header{background:#111;border-bottom:1px solid #282828;padding:14px 18px 12px;position:sticky;top:0;z-index:50}
    .h-row{display:flex;align-items:center;gap:12px}
    .h-avatar{width:44px;height:44px;background:#FC4C02;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:#fff}
    .h-meta{flex:1;min-width:0}
    .h-name{font-family:'Syne',sans-serif;font-weight:800;font-size:16px}
    .h-sub{font-size:11px;color:#5A5A5A}
    .h-row2{display:flex;align-items:center;gap:8px;margin-top:10px}
    .h-chip{background:#1A1A1A;border:1px solid #282828;border-radius:8px;padding:4px 10px;font-size:11px;color:#5A5A5A}
    .h-chip span{color:#FC4C02;font-weight:600}
    .h-refresh{background:transparent;border:1px solid #FC4C02;border-radius:8px;padding:4px 12px;color:#FC4C02;font-size:11px;font-weight:600}
    .tabs{display:flex;gap:4px;margin-top:10px}
    .tab{flex:1;padding:7px 0;border-radius:8px;font-size:11px;font-weight:600;border:none;color:#5A5A5A;background:#1A1A1A;transition:all .15s}
    .tab.active{background:#FC4C02;color:#fff}

    /* Cards */
    .card{background:#171717;border:1px solid #282828;border-radius:14px}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
    .stat-box{background:#171717;border:1px solid #282828;border-radius:14px;padding:14px 12px;text-align:center}
    .stat-val{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;line-height:1.1}
    .stat-lbl{font-size:10px;color:#5A5A5A;margin-top:4px;text-transform:uppercase;letter-spacing:1px}
    .stat-sub{font-size:10px;color:#5A5A5A;margin-top:2px}

    /* Sections */
    .sec{font-family:'Syne',sans-serif;font-weight:800;font-size:10px;color:#5A5A5A;letter-spacing:2px;text-transform:uppercase;margin:20px 0 10px}

    /* Analysis */
    .anal-card{background:#171717;border:1px solid #282828;border-radius:14px;padding:16px;border-left:3px solid #FC4C02}
    .anal-intro{font-size:13px;line-height:1.75;margin-bottom:12px}
    .anal-pt{margin-bottom:10px}
    .anal-pt-title{font-size:12px;font-weight:700;color:#FC4C02;margin-bottom:2px}
    .anal-pt-text{font-size:12px;color:#CCC;line-height:1.65}
    .anal-concl{font-size:12px;color:#00C896;font-weight:600;margin-top:10px;padding-top:10px;border-top:1px solid #282828}

    /* Day grid */
    .day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
    .day-card{background:#1F1F1F;border-radius:12px;padding:7px 3px;text-align:center;min-height:95px}
    .day-name{font-size:9px;font-weight:700;letter-spacing:.5px;margin-bottom:0}
    .day-date{font-size:8px;color:#5A5A5A;margin-bottom:4px}
    .day-emoji{font-size:18px;margin-bottom:1px}
    .day-km{font-family:'Syne',sans-serif;font-weight:800;font-size:13px;line-height:1}
    .day-unit{font-size:8px;color:#5A5A5A}
    .day-pace{font-size:8px;margin:2px 0}
    .day-hr{font-size:8px;color:#5A5A5A}
    .day-pr{display:inline-block;margin-top:3px;padding:2px 5px;border-radius:100px;background:#FC4C02;color:#fff;font-size:7px;font-weight:700}
    .day-muted{font-size:9px;color:#5A5A5A}

    /* Streak */
    .streak-card{padding:16px;border-radius:14px;background:rgba(252,76,2,.1);border:1px solid rgba(252,76,2,.27);margin-top:8px}
    .streak-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
    .streak-num{color:#FC4C02}
    .streak-sub{font-size:11px;color:#5A5A5A;margin-bottom:10px}
    .streak-track{background:#2A2A2A;border-radius:100px;height:6px}
    .streak-fill{background:#FC4C02;border-radius:100px;height:6px}

    /* Zones */
    .zone-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
    .zone-lbl{width:20px;font-size:11px;color:#5A5A5A;font-weight:700}
    .zone-bar-bg{flex:1;background:#222;border-radius:4px;height:16px;overflow:hidden}
    .zone-bar{height:100%;border-radius:4px}
    .zone-pct{width:30px;font-size:12px;font-weight:700;text-align:right}
    .zone-bpm{width:72px;font-size:9px;color:#5A5A5A;text-align:right}

    /* Content */
    #content{padding:12px 14px 0}
    .week-label{font-size:11px;color:#5A5A5A;margin-bottom:8px}
    .install-hint{margin-top:18px;padding:10px 14px;background:#111;border:1px dashed #282828;border-radius:10px;font-size:10px;color:#5A5A5A;text-align:center}

    /* Error */
    #error-screen{display:none;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;gap:16px;text-align:center}
    .err-btn{background:#FC4C02;border:none;border-radius:10px;padding:12px 28px;color:#fff;font-size:14px;font-weight:700}
  </style>
</head>
<body>
<div id="app">
  <!-- Splash -->
  <div id="splash">
    <div class="s-avatar">S</div>
    <p class="sy" style="font-size:19px">Strava Performance</p>
    <p id="splash-msg" style="font-size:13px;color:#5A5A5A">Iniciando...</p>
    <div class="s-bar"></div>
  </div>

  <!-- Error -->
  <div id="error-screen">
    <span style="font-size:40px">⚠️</span>
    <p class="sy" style="font-size:20px">Erro de conexão</p>
    <p id="error-msg" style="font-size:13px;color:#5A5A5A;max-width:300px;line-height:1.6"></p>
    <button class="err-btn" onclick="reconnect()">Reconectar Strava</button>
  </div>

  <!-- Main (hidden until loaded) -->
  <div id="main" style="display:none">
    <div id="header">
      <div class="h-row">
        <div class="h-avatar">S</div>
        <div class="h-meta">
          <div class="h-name sy" id="athlete-name">—</div>
          <div class="h-sub">Strava · Dashboard de Performance</div>
        </div>
      </div>
      <div class="h-row2">
        <div class="h-chip">Atualizado: <span id="upd-date">—</span></div>
        <button class="h-refresh" onclick="doRefresh()">⟳ Atualizar dados</button>
      </div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('atual')" id="tab-atual">Esta Semana</button>
        <button class="tab" onclick="switchTab('anterior')" id="tab-anterior">Semana Ant.</button>
        <button class="tab" onclick="switchTab('meses')" id="tab-meses">6 Meses</button>
      </div>
    </div>
    <div id="content">
      <div class="week-label" id="week-label"></div>
      <div id="view-atual"></div>
      <div id="view-anterior" style="display:none"></div>
      <div id="view-meses" style="display:none"></div>
      <div class="install-hint">📱 Safari → Compartilhar → Adicionar à Tela de Início</div>
    </div>
  </div>
</div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────────────────
const CID   = "235154";
const CS    = "503e9c222e53cac459e0788ddac6f23ef692e1a2";
const REDIR = location.origin + location.pathname;
const STOK  = "https://www.strava.com/oauth/token";
const SAUTH = "https://www.strava.com/oauth/authorize";
const SAPI  = "https://www.strava.com/api/v3";
const OR="#FC4C02",GR="#00C896",BL="#3B82F6";
const ZC=["#FECACA","#FCA5A5","#F87171","#EF4444","#B91C1C"];
const DZ=[{min:0,max:115},{min:115,max:152},{min:152,max:171},{min:171,max:190},{min:190,max:-1}];
const DAYS=["DOM","SEG","TER","QUA","QUI","SEX","SÁB"];

// ── UTILS ────────────────────────────────────────────────────────────────────
const ls={get:k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v)),del:k=>localStorage.removeItem(k)};
const isRun=t=>["Run","TrailRun","VirtualRun"].includes(t);
const isGym=t=>["WeightTraining","Yoga","Workout"].includes(t);
const fmtPace=ms=>{if(!ms)return"--";const s=1000/ms;return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;};
const paceN=ms=>ms?+(1000/ms/60).toFixed(2):null;
const paSt=n=>{const m=Math.floor(n),s=Math.round((n-m)*60);return`${m}:${String(s).padStart(2,"0")}`;};
const fmtMon=d=>new Date(d).toLocaleDateString("pt-BR",{month:"short",year:"2-digit"});
const fmtDate=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function el(tag,attrs,html){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{if(k==="style"&&typeof v==="object")Object.assign(e.style,v);else e.setAttribute(k,v);});
  if(html)e.innerHTML=html;
  return e;
}

// ── STATE ────────────────────────────────────────────────────────────────────
let STATE={athlete:null,acts:[],stats:null,zones:DZ,tab:"atual"};

// ── STRAVA API ────────────────────────────────────────────────────────────────
async function stravaGet(path,token){
  let tok=token;
  if(Date.now()/1000>=(tok.expires_at||0)-60){
    const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:CID,client_secret:CS,refresh_token:tok.refresh_token,grant_type:"refresh_token"})});
    const d=await r.json();
    if(!d.access_token)throw new Error("Sessão expirada — reconecte");
    ls.set("s_tok",d);tok=d;
  }
  const r=await fetch(SAPI+path,{headers:{Authorization:`Bearer ${tok.access_token}`}});
  if(!r.ok)throw new Error(`Strava ${r.status}`);
  return r.json();
}

async function loadAll(token){
  setStatus("Carregando atividades...");
  const athlete=await stravaGet("/athlete",token);
  const acts=await stravaGet("/athlete/activities?per_page=200",token);
  const stats=await stravaGet(`/athletes/${athlete.id}/stats`,token).catch(()=>null);
  const zr=await stravaGet("/athlete/zones",token).catch(()=>null);
  STATE.athlete=athlete;
  STATE.acts=acts;
  STATE.stats=stats;
  STATE.zones=(zr&&zr.heart_rate&&zr.heart_rate.zones)||DZ;
}

// ── INIT ─────────────────────────────────────────────────────────────────────
async function init(){
  try{
    const p=new URLSearchParams(location.search);
    const code=p.get("code");
    if(code){
      history.replaceState({},"",location.pathname);
      setStatus("Autorizando...");
      const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({client_id:CID,client_secret:CS,code,grant_type:"authorization_code"})});
      const d=await r.json();
      if(!d.access_token)throw new Error(d.message||"Token inválido");
      ls.set("s_tok",d);
      await loadAll(d);
      showMain();return;
    }
    const saved=ls.get("s_tok");
    if(saved){
      setStatus("Conectando...");
      try{await loadAll(saved);showMain();return;}
      catch(e){ls.del("s_tok");}
    }
    setStatus("Abrindo o Strava...");
    setTimeout(()=>{location.href=`${SAUTH}?client_id=${CID}&redirect_uri=${encodeURIComponent(REDIR)}&response_type=code&approval_prompt=auto&scope=read,activity:read_all`;},700);
  }catch(err){showError(err.message);}
}

function setStatus(msg){document.getElementById("splash-msg").textContent=msg;}
function reconnect(){ls.del("s_tok");location.reload();}
async function doRefresh(){
  try{
    const t=ls.get("s_tok");
    if(!t)return;
    document.querySelector(".h-refresh").textContent="...";
    await loadAll(t);
    renderAll();
    document.querySelector(".h-refresh").textContent="⟳ Atualizar dados";
  }catch(e){alert(e.message);}
}

function showError(msg){
  document.getElementById("splash").style.display="none";
  document.getElementById("error-screen").style.display="flex";
  document.getElementById("error-msg").textContent=msg;
}

function showMain(){
  document.getElementById("splash").style.display="none";
  document.getElementById("main").style.display="block";
  document.getElementById("athlete-name").textContent=STATE.athlete?`${STATE.athlete.firstname} ${STATE.athlete.lastname}`:"—";
  document.getElementById("upd-date").textContent=new Date().toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"});
  renderAll();
}

// ── TABS ─────────────────────────────────────────────────────────────────────
function switchTab(tab){
  STATE.tab=tab;
  ["atual","anterior","meses"].forEach(t=>{
    document.getElementById(`tab-${t}`).className="tab"+(t===tab?" active":"");
    document.getElementById(`view-${t}`).style.display=t===tab?"block":"none";
  });
  const wl=document.getElementById("week-label");
  if(tab==="atual"){wl.textContent=weekLabel(0);wl.style.display="block";}
  else if(tab==="anterior"){wl.textContent=weekLabel(1);wl.style.display="block";}
  else wl.style.display="none";
}

// ── WEEK HELPERS ──────────────────────────────────────────────────────────────
function weekBounds(offset){
  const now=new Date();const dow=(now.getDay()+6)%7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow-offset*7);mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return{mon,sun};
}
function filterWeek(acts,offset){
  const{mon,sun}=weekBounds(offset);
  return acts.filter(a=>{const d=new Date(a.start_date);return d>=mon&&d<=sun;});
}
function weekLabel(offset){
  const{mon,sun}=weekBounds(offset);
  const f=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  return`${f(mon)} – ${f(sun)} ${sun.getFullYear()}`;
}
function calcStreak(acts){
  const runs=acts.filter(a=>isRun(a.type));
  if(!runs.length)return 0;
  let streak=0;
  const now=new Date();
  // Start from this Monday
  let ws=new Date(now);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));ws.setHours(0,0,0,0);
  // If no run yet this week (week in progress), start counting from last week
  const curWe=new Date(ws);curWe.setDate(curWe.getDate()+7);
  const hasThisWeek=runs.some(r=>{const d=new Date(r.start_date);return d>=ws&&d<curWe;});
  if(!hasThisWeek) ws.setDate(ws.getDate()-7);
  // Count consecutive weeks backwards
  for(let i=0;i<60;i++){
    const we=new Date(ws);we.setDate(we.getDate()+7);
    if(!runs.some(r=>{const d=new Date(r.start_date);return d>=ws&&d<we;}))break;
    streak++;ws.setDate(ws.getDate()-7);
  }
  return streak;
}
function buildMonthly(acts){
  const map={};
  acts.filter(a=>isRun(a.type)).forEach(r=>{
    const k=fmtMon(r.start_date);
    if(!map[k])map[k]={label:k,km:0,runs:0,pSum:0,hrSum:0,hrN:0,ts:new Date(r.start_date).getTime()};
    map[k].km+=r.distance/1000;map[k].runs++;map[k].pSum+=paceN(r.average_speed)||0;
    if(r.has_heartrate&&r.average_heartrate){map[k].hrSum+=r.average_heartrate;map[k].hrN++;}
  });
  return Object.values(map).sort((a,b)=>a.ts-b.ts).map(m=>({
    label:m.label,km:+m.km.toFixed(1),corridas:m.runs,
    pace:+(m.pSum/Math.max(m.runs,1)).toFixed(2),
    hr:m.hrN?Math.round(m.hrSum/m.hrN):null
  }));
}

// ── HR ZONES ─────────────────────────────────────────────────────────────────
function estimateZones(acts,ranges){
  let total=0;const zSec=ranges.map(()=>0);
  acts.forEach(a=>{
    const dur=a.moving_time||0;if(!dur)return;
    let dist;
    if(isGym(a.type)){dist=[.75,.18,.05,.02,.00];}
    else if(a.has_heartrate&&a.average_heartrate){
      const avg=a.average_heartrate,sig=15;
      const phi=x=>0.5*(1+Math.tanh(x/1.4142));
      const raw=ranges.map(({min,max})=>{const hi=max===-1?avg+50:max;return Math.max(0,phi((hi-avg)/sig)-phi((min-avg)/sig));});
      const s=raw.reduce((a,b)=>a+b,0)||1;dist=raw.map(v=>v/s);
    }else return;
    total+=dur;dist.forEach((p,i)=>{if(i<zSec.length)zSec[i]+=dur*p;});
  });
  if(!total)return null;
  const s=zSec.reduce((a,b)=>a+b,0)||1;
  return zSec.map(v=>Math.round(v/s*100));
}

// ── COACH ANALYSIS ────────────────────────────────────────────────────────────
function analyzeWeek(wActs,pActs,isCurrent){
  const wr=wActs.filter(a=>isRun(a.type));
  const pr=pActs.filter(a=>isRun(a.type));
  const wkm=wr.reduce((s,r)=>s+r.distance/1000,0);
  const pkm=pr.reduce((s,r)=>s+r.distance/1000,0);
  const wsp=wr.length?wr.reduce((s,r)=>s+(r.average_speed||0),0)/wr.length:0;
  const psp=pr.length?pr.reduce((s,r)=>s+(r.average_speed||0),0)/pr.length:0;
  const hrr=wr.filter(r=>r.has_heartrate&&r.average_heartrate);
  const avgHR=hrr.length?Math.round(hrr.reduce((s,r)=>s+r.average_heartrate,0)/hrr.length):null;
  const effort=wr.reduce((s,r)=>s+(r.suffer_score||0),0);
  const chg=pkm>0?(wkm-pkm)/pkm*100:null;
  const pcChg=wsp>0&&psp>0?paceN(wsp)-paceN(psp):null;

  if(!wr.length)return{headline:isCurrent?"Nenhuma corrida ainda esta semana":"Semana sem corridas",points:[isCurrent?"Semana em andamento. Descanso ativo faz parte do processo.":"Semana de descanso ou intercorrência."],conclusion:""};

  const pts=[];
  if(chg!==null)pts.push(`${chg>=0?"📈":"📉"} Volume ${chg>=0?"acima":"abaixo"} da semana anterior — ${Math.abs(chg).toFixed(0)}% (${pkm.toFixed(1)} → ${wkm.toFixed(1)} km). ${chg>15?"Progressão alta — monitore fadiga.":chg<-25?"Volume reduzido — se intencional, ótimo.":"Progressão segura."}`);
  if(wsp>0)pts.push(psp>0?(pcChg<-0.05?`⚡ Ritmo melhorou — ${fmtPace(wsp)}/km vs ${fmtPace(psp)}/km. Adaptação positiva.`:`🧘 Ritmo conservador — ${fmtPace(wsp)}/km vs ${fmtPace(psp)}/km.`):`⚡ Ritmo médio: ${fmtPace(wsp)}/km.`);
  if(avgHR){const z=avgHR<115?"Z1":avgHR<152?"Z2 (aeróbico base)":avgHR<171?"Z3 (intenso)":"Z4+";pts.push(`❤️ FC média: ${avgHR} bpm (${z}). ${avgHR<152?"Ideal para construção aeróbica.":"Alta intensidade — garanta recuperação."}`);}
  if(effort>0)pts.push(`🔥 Esforço relativo: ${effort} pts — ${effort>150?"alta carga.":effort>80?"carga moderada.":"carga leve."}`);

  const conc=isCurrent?(wr.length>=3?"Frequência consistente esta semana.":"Adicione mais uma corrida para manter o streak."):(pcChg&&pcChg<-0.1?"Semana com evolução de ritmo — ótimo sinal.":"Semana sólida de base aeróbica.");
  return{headline:`${wr.length} corrida${wr.length>1?"s":""} · ${wkm.toFixed(1)} km${chg!=null?" ("+(chg>=0?"+":"")+chg.toFixed(0)+"% vs ant.)":""}`,points:pts,conclusion:conc};
}

function analyzeSix(monthly,totalKm,count,streak,maxKm){
  if(!monthly||monthly.length<2)return null;
  const f=monthly[0],l=monthly[monthly.length-1];
  const imp=f.pace-l.pace;
  const impStr=`${Math.floor(Math.abs(imp))}:${String(Math.round((Math.abs(imp)%1)*60)).padStart(2,"0")}`;
  const vChg=f.km>0?((l.km-f.km)/f.km*100):0;
  const best=[...monthly].sort((a,b)=>b.km-a.km)[0];
  const paceImproved=imp>0; // f.pace > l.pace means got faster (lower number)
  const volTitle=vChg>=5?"Volume crescendo com qualidade":vChg<=-5?"Volume em ajuste — foco na consistência":"Volume estável";
  return{
    intro:`O número mais importante: seu ritmo saiu de ${paSt(f.pace)}/km em ${f.label} para ${paSt(l.pace)}/km em ${l.label} — ${paceImproved?impStr+" de melhora":"sem mudança significativa"} em ${monthly.length} meses. ${paceImproved&&imp>0.3?"Para um iniciante, isso é acima da curva.":"Evolução consistente no período."}`,
    points:[
      {icon:"🔥",title:"Consistência fora do normal",text:`${streak} semanas consecutivas sem uma semana em branco. Isso é o que separa atletas que evoluem dos que ficam estagnados.`},
      {icon:"📈",title:volTitle,text:`De ${f.km.toFixed(0)} km em ${f.label} para ${l.km.toFixed(0)} km em ${l.label} (${vChg>0?"+":""}${vChg.toFixed(0)}%). Melhor mês: ${best.label} com ${best.km.toFixed(1)} km.`},
      {icon:"🎯",title:"Próximo passo está claro",text:`Maior corrida: ${maxKm} km. Adicione corrida longa semanal — ${Math.ceil(maxKm)+1} km aos sábados. Um 10K até agosto é totalmente factível.`}
    ],
    conclusion:`Com ${totalKm} km em ${count} corridas, a base está sólida. Meta: ${paSt(l.pace-0.2)}/km nos próximos 60 dias.`
  };
}

// ── SVG CHARTS ────────────────────────────────────────────────────────────────
function lineChart(data,dKey,color,height,reversed){
  const pts=data.filter(d=>d[dKey]!=null);
  if(pts.length<2)return"";
  const vals=pts.map(d=>d[dKey]);
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const W=300,P=8,IH=height-16;
  const mapped=pts.map((d,i)=>({
    x:P+(i/(pts.length-1))*(W-P*2),
    y:reversed?P+((d[dKey]-mn)/rng)*IH:IH+P-((d[dKey]-mn)/rng)*IH,
    l:d.label
  }));
  const path=mapped.map((p,i)=>`${i?"L":"M"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const area=path+` L${mapped[mapped.length-1].x.toFixed(1)},${IH+P} L${mapped[0].x.toFixed(1)},${IH+P} Z`;
  const gid="g"+Math.random().toString(36).slice(2,8);
  const step=Math.max(1,Math.ceil(mapped.length/5));
  const circles=mapped.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${color}"/>`).join("");
  const labels=mapped.filter((_,i)=>i%step===0||i===mapped.length-1).map(p=>`<text x="${p.x.toFixed(1)}" y="${height}" text-anchor="middle" font-size="9" fill="#5A5A5A">${esc(p.l)}</text>`).join("");
  return`<svg viewBox="0 0 ${W} ${height}" style="width:100%;height:${height}px"><defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.2"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#${gid})"/><path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>${circles}${labels}</svg>`;
}

function barChart(data,dKey,color,height){
  const vals=data.map(d=>d[dKey]||0),mx=Math.max(...vals,1);
  const W=300,P=8,n=data.length,bw=Math.min(22,(W-P*2)/n-3);
  const step=Math.max(1,Math.ceil(n/5));
  const bars=data.map((d,i)=>{
    const x=P+(i/n)*(W-P*2)+bw*0.2,bh=((d[dKey]||0)/mx)*(height-16);
    const lbl=(i%step===0||i===n-1)?`<text x="${(x+bw/2).toFixed(1)}" y="${height}" text-anchor="middle" font-size="9" fill="#5A5A5A">${esc(d.label)}</text>`:"";
    return`<rect x="${x.toFixed(1)}" y="${(height-14-bh).toFixed(1)}" width="${bw}" height="${Math.max(bh,1).toFixed(1)}" fill="${color}" rx="3" opacity="0.9"/>${lbl}`;
  }).join("");
  return`<svg viewBox="0 0 ${W} ${height}" style="width:100%;height:${height}px">${bars}</svg>`;
}

function zonesHtml(pct,ranges){
  if(!pct)return`<p style="color:#5A5A5A;font-size:12px;padding:8px 0">Dados insuficientes.</p>`;
  const labels=ranges.map(({min,max},i)=>max===-1?`>${min}`:i===0?`<${max}`:`${min}–${max}`);
  const top=pct.indexOf(Math.max(...pct));
  const rows=[4,3,2,1,0].map(i=>`
    <div class="zone-row">
      <div class="zone-lbl">Z${i+1}</div>
      <div class="zone-bar-bg"><div class="zone-bar" style="width:${Math.max(pct[i],1)}%;background:${ZC[i]}"></div></div>
      <div class="zone-pct" style="color:${ZC[i]}">${pct[i]}%</div>
      <div class="zone-bpm">${labels[i]} bpm</div>
    </div>`).join("");
  return`<div style="font-size:13px;font-weight:600;margin-bottom:10px">${pct[top]}% em Zona ${top+1} <span style="font-size:11px;color:#5A5A5A;font-weight:400">(${labels[top]} bpm)</span></div>${rows}`;
}

// ── RENDER WEEK ───────────────────────────────────────────────────────────────
function renderWeek(container,offset){
  const wa=filterWeek(STATE.acts,offset);
  const pa=filterWeek(STATE.acts,offset+1);
  const runs=wa.filter(a=>isRun(a.type));
  const tkm=runs.reduce((s,r)=>s+r.distance/1000,0);
  const pkm=pa.filter(a=>isRun(a.type)).reduce((s,r)=>s+r.distance/1000,0);
  const asp=runs.length?runs.reduce((s,r)=>s+(r.average_speed||0),0)/runs.length:0;
  const hrr=runs.filter(r=>r.has_heartrate&&r.average_heartrate);
  const avgHR=hrr.length?Math.round(hrr.reduce((s,r)=>s+r.average_heartrate,0)/hrr.length):null;
  const chg=pkm>0?(tkm-pkm)/pkm*100:null;
  const anal=analyzeWeek(wa,pa,offset===0);
  const zpct=estimateZones(wa,STATE.zones);

  // Stats
  const sub=chg!=null?`${chg>=0?"+":""}${chg.toFixed(0)}% vs ant.`:"";
  let html=`<div class="stat-grid">
    <div class="stat-box"><div class="stat-val" style="color:${OR}">${tkm.toFixed(1)}</div><div class="stat-lbl">km total</div>${sub?`<div class="stat-sub">${sub}</div>`:""}</div>
    <div class="stat-box"><div class="stat-val">${asp>0?fmtPace(asp):"--"}</div><div class="stat-lbl">pace médio</div></div>
    <div class="stat-box"><div class="stat-val">${runs.length}</div><div class="stat-lbl">corridas</div></div>
    <div class="stat-box"><div class="stat-val" style="color:${avgHR?BL:"#5A5A5A"}">${avgHR||"--"}</div><div class="stat-lbl">fc média bpm</div></div>
  </div>`;

  // Analysis
  html+=`<div class="sec">Análise do Coach</div><div class="anal-card">`;
  anal.points.forEach(p=>html+=`<div class="anal-pt"><div class="anal-pt-text">${esc(p)}</div></div>`);
  if(anal.conclusion)html+=`<div class="anal-concl">→ ${esc(anal.conclusion)}</div>`;
  html+=`</div>`;

  // Day grid
  const{mon}=weekBounds(offset);
  html+=`<div class="sec">Dias da Semana</div><div class="day-grid">`;
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const k=d.toISOString().split("T")[0];
    const da=STATE.acts.filter(a=>a.start_date.startsWith(k));
    const run=da.find(a=>isRun(a.type));
    const gym=da.find(a=>isGym(a.type));
    const bd=run?OR:gym?BL:"#282828";
    const dname=DAYS[d.getDay()];
    const ddate=`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}`;
    let inner="";
    if(run){
      const pr=run.suffer_score>85;
      inner=`<div class="day-emoji">🏃</div><div class="day-km">${(run.distance/1000).toFixed(1)}</div><div class="day-unit">km</div><div class="day-pace" style="color:${OR}">${fmtPace(run.average_speed)}/km</div>${run.has_heartrate?`<div class="day-hr">${Math.round(run.average_heartrate)}bpm</div>`:""}${pr?`<div class="day-pr">🏅 RP</div>`:""}`;
    }else if(gym){
      inner=`<div class="day-emoji">🏋️</div><div class="day-muted">Musculação</div>`;
    }else{
      inner=`<div class="day-emoji">😴</div><div class="day-muted">Descanso</div>`;
    }
    html+=`<div class="day-card" style="border:2px solid ${bd}"><div class="day-name" style="color:${run?OR:gym?BL:"#5A5A5A"}">${dname}</div><div class="day-date">${ddate}</div>${inner}</div>`;
  }
  html+=`</div>`;

  // Pace chart
  if(runs.length>1){
    const paceData=runs.slice().reverse().map(r=>({label:fmtDate(r.start_date),pace:paceN(r.average_speed)}));
    html+=`<div class="sec">Pace por Corrida</div><div class="card" style="padding:14px">${lineChart(paceData,"pace",OR,110,false)}<p style="font-size:10px;color:#5A5A5A;text-align:center;margin-top:4px">linha descendo = melhora de ritmo</p></div>`;
  }

  // Zones
  html+=`<div class="sec">Zonas de Frequência Cardíaca</div><div class="card" style="padding:14px">${zonesHtml(zpct,STATE.zones)}</div>`;

  container.innerHTML=html;
}

// ── RENDER 6 MONTHS ───────────────────────────────────────────────────────────
function renderSix(container){
  const since=new Date();since.setMonth(since.getMonth()-6);
  const recent=STATE.acts.filter(a=>new Date(a.start_date)>=since);
  const runs=recent.filter(a=>isRun(a.type));
  const monthly=buildMonthly(recent);
  const streak=calcStreak(STATE.acts);
  const totalKm=Math.round(runs.reduce((s,r)=>s+r.distance/1000,0));
  const biggest=runs.length?[...runs].sort((a,b)=>b.distance-a.distance)[0]:null;
  const maxKm=biggest?+(biggest.distance/1000).toFixed(1):0;
  const avgSp=runs.length?runs.reduce((s,r)=>s+(r.average_speed||0),0)/runs.length:0;
  // Show most recent month's pace instead of overall average
  const recentPace=monthly.length>0?monthly[monthly.length-1].pace:null;
  const anal=analyzeSix(monthly,totalKm,runs.length,streak,maxKm);
  const zpct=estimateZones(recent,STATE.zones);
  const pct=Math.min(Math.round(streak/52*100),100);

  let html=`<div class="stat-grid">
    <div class="stat-box"><div class="stat-val" style="color:${OR}">${totalKm}</div><div class="stat-lbl">km totais</div><div class="stat-sub">${runs.length} corridas</div></div>
    <div class="stat-box"><div class="stat-val">${recentPace?paSt(recentPace):"--"}</div><div class="stat-lbl">pace atual</div><div class="stat-sub">${monthly.length>0?monthly[monthly.length-1].label:""}</div></div>
    <div class="stat-box"><div class="stat-val" style="color:${OR}">${streak}</div><div class="stat-lbl">semanas seguidas</div></div>
    <div class="stat-box"><div class="stat-val">${maxKm}</div><div class="stat-lbl">maior corrida</div><div class="stat-sub">km</div></div>
  </div>`;

  html+=`<div class="streak-card">
    <div class="streak-row"><span style="font-size:22px">🔥</span><span class="sy" style="font-size:18px"><span class="streak-num">${streak}</span> semanas consecutivas</span></div>
    <div class="streak-sub">Meta de 52 semanas — ${pct}% · ${52-streak} restantes</div>
    <div class="streak-track"><div class="streak-fill" style="width:${pct}%"></div></div>
  </div>`;

  if(anal){
    html+=`<div class="sec">Análise dos 6 Meses</div><div class="anal-card"><p class="anal-intro">${esc(anal.intro)}</p>`;
    anal.points.forEach(p=>html+=`<div class="anal-pt"><div class="anal-pt-title">${esc(p.icon)} ${esc(p.title)}</div><div class="anal-pt-text">${esc(p.text)}</div></div>`);
    html+=`<div class="anal-concl">→ ${esc(anal.conclusion)}</div></div>`;
  }

  if(monthly.length>1){
    html+=`<div class="sec">Ritmo Médio por Mês</div><div class="card" style="padding:14px"><p style="font-size:10px;color:#5A5A5A;margin-bottom:8px">min/km — linha descendo = melhora de ritmo</p>${lineChart(monthly,"pace",OR,115,false)}</div>`;
    html+=`<div class="sec">Volume Mensal (km)</div><div class="card" style="padding:14px">${barChart(monthly,"km",OR,100)}</div>`;
    html+=`<div class="sec">Frequência de Corridas</div><div class="card" style="padding:14px">${barChart(monthly,"corridas","#666",85)}</div>`;
    if(monthly.some(m=>m.hr))html+=`<div class="sec">FC Média por Mês</div><div class="card" style="padding:14px"><p style="font-size:10px;color:#5A5A5A;margin-bottom:8px">adaptação cardiovascular</p>${lineChart(monthly.filter(m=>m.hr),"hr",BL,110,false)}</div>`;
  }

  html+=`<div class="sec">Zonas de FC · 6 Meses</div><div class="card" style="padding:14px">${zonesHtml(zpct,STATE.zones)}</div>`;
  container.innerHTML=html;
}

// ── RENDER ALL ────────────────────────────────────────────────────────────────
function renderAll(){
  renderWeek(document.getElementById("view-atual"),0);
  renderWeek(document.getElementById("view-anterior"),1);
  renderSix(document.getElementById("view-meses"));
  switchTab(STATE.tab);
  document.getElementById("week-label").textContent=weekLabel(0);
}
