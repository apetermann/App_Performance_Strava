/* ── UTILS ── */
const paceMs=ms=>{if(!ms)return"--";const s=1000/ms;return`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;};
const paceN=ms=>ms?+(1000/ms/60).toFixed(2):null;
const fmtDur=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h?`${h}h ${m}m`:`${m}m`;};

const fmtFull=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
const fmtDay=d=>new Date(d).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"});

/* ── WEEK HELPERS ── */
function getWeekBounds(offset=0){
  const today=new Date();
  const dow=(today.getDay()+6)%7;
  const mon=new Date(today);mon.setDate(today.getDate()-dow-(offset*7));mon.setHours(0,0,0,0);
  const sun=new Date(mon);sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  return{mon,sun};
}
function getWeekActs(acts,offset=0){
  const{mon,sun}=getWeekBounds(offset);
  return acts.filter(a=>{const d=new Date(a.start_date);return d>=mon&&d<=sun;});
}
function getWeekDays(acts,offset=0){
  const{mon}=getWeekBounds(offset);
  return Array.from({length:7},(_,i)=>{
    const d=new Date(mon);d.setDate(d.getDate()+i);
    const ds=d.toISOString().split("T")[0];
    return{date:d,acts:acts.filter(a=>a.start_date.startsWith(ds))};
  });
}
function weekLabel(offset){
  const{mon,sun}=getWeekBounds(offset);
  const fmt=d=>d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"});
  return`${fmt(mon)} – ${fmt(sun)} ${sun.getFullYear()}`;
}

/* ── HR ZONES ESTIMATION ── */
// Given avg HR and zone boundaries, estimate time distribution across zones
// Uses a bell curve centered on avg HR, spread ≈ 12% of maxHR
function estimateZoneDist(avgHR, maxHR, zoneRanges, isGymAct=false){
  if(!zoneRanges||!zoneRanges.length) return null;
  if(isGymAct) return[0.75,0.18,0.05,0.02,0.00]; // gym: mostly Z1
  if(!avgHR) return null;
  const sigma=maxHR?maxHR*0.12:18;
  const dist=zoneRanges.map(({min,max})=>{
    const lo=min, hi=max===-1?maxHR*1.2:max;
    // Approximate area under normal curve between lo and hi
    const norm=x=>0.5*(1+Math.tanh((x-avgHR)/(sigma*1.41)));
    return Math.max(0,norm(hi)-norm(lo));
  });
  const sum=dist.reduce((a,b)=>a+b,0)||1;
  return dist.map(d=>d/sum);
}

function aggregateZones(acts, zoneRanges){
  if(!zoneRanges||!zoneRanges.length) return null;
  let totalSec=0;
  const zoneSec=[0,0,0,0,0];
  acts.forEach(a=>{
    const dur=a.moving_time||0;
    const gym=isGym(a.type);
    const hr=a.has_heartrate?a.average_heartrate:null;
    const maxHr=a.max_heartrate||190;
    const dist=estimateZoneDist(gym?80:hr, maxHr, zoneRanges, gym);
    if(!dist)return;
    totalSec+=dur;
    dist.forEach((p,i)=>{if(i<5)zoneSec[i]+=dur*p;});
  });
  if(!totalSec)return null;
  const total=zoneSec.reduce((a,b)=>a+b,0)||1;
  return zoneSec.map(s=>Math.round(s/total*100));
}

/* ── MONTHLY DATA ── */
function buildMonthly(acts){
  const map={};
  acts.filter(a=>isRun(a.type)).forEach(r=>{
    const k=fmtMon(r.start_date);
    if(!map[k])map[k]={label:k,runs:0,km:0,paceSum:0,hrSum:0,hrN:0,order:new Date(r.start_date).getTime()};
    map[k].runs++;map[k].km+=r.distance/1000;map[k].paceSum+=(paceN(r.average_speed)||0);
    if(r.has_heartrate){map[k].hrSum+=r.average_heartrate;map[k].hrN++;}
  });
  return Object.values(map).sort((a,b)=>a.order-b.order)
    .map(m=>({label:m.label,km:+m.km.toFixed(1),corridas:m.runs,
      pace:+(m.paceSum/m.runs).toFixed(2),hr:m.hrN?Math.round(m.hrSum/m.hrN):null}));
}

/* ── STREAK ── */
function calcStreak(acts){
  const runs=acts.filter(a=>isRun(a.type)).sort((a,b)=>new Date(b.start_date)-new Date(a.start_date));
  let streak=0;
  const today=new Date();
  let ws=new Date(today);ws.setDate(ws.getDate()-((ws.getDay()+6)%7));ws.setHours(0,0,0,0);
  for(let i=0;i<60;i++){
    const we=new Date(ws);we.setDate(we.getDate()+7);
    if(!runs.some(r=>{const d=new Date(r.start_date);return d>=ws&&d<we;}))break;
    streak++;ws.setDate(ws.getDate()-7);
  }
  return streak;
}

/* ── COACH ANALYSIS ── */
function paceStr(p){const m=Math.floor(p),s=Math.round((p-m)*60);return`${m}:${String(s).padStart(2,"0")}`;}

function analyzeWeek(weekActs, prevActs, isCurrent){
  const wRuns=weekActs.filter(a=>isRun(a.type));
  const pRuns=prevActs.filter(a=>isRun(a.type));
  const wKm=wRuns.reduce((s,r)=>s+r.distance/1000,0);
  const pKm=pRuns.reduce((s,r)=>s+r.distance/1000,0);
  const kmChg=pKm>0?(wKm-pKm)/pKm*100:0;
  const wSpd=wRuns.length?wRuns.reduce((s,r)=>s+r.average_speed,0)/wRuns.length:0;
  const pSpd=pRuns.length?pRuns.reduce((s,r)=>s+r.average_speed,0)/pRuns.length:0;
  const paceChg=pSpd>0?paceN(wSpd)-paceN(pSpd):0;
  const wHR=wRuns.filter(r=>r.has_heartrate);
  const avgHR=wHR.length?Math.round(wHR.reduce((s,r)=>s+r.average_heartrate,0)/wHR.length):null;
  const effort=wRuns.reduce((s,r)=>s+(r.suffer_score||0),0);

  if(!wRuns.length){
    return{headline:"Sem corridas nesta semana",points:[isCurrent?"Semana em andamento ou de descanso ativo. O descanso é parte do treino — os músculos se reconstroem nesse período.":"Semana sem corridas. Pode ter sido descanso planejado ou intercorrência."],conclusion:""};
  }

  const points=[];

  // Volume
  if(pKm>0){
    const dir=kmChg>=0?"📈 Acima":"📉 Abaixo";
    points.push(`${dir} do volume habitual — ${Math.abs(kmChg).toFixed(0)}% ${kmChg>=0?"a mais":"a menos"} que a semana anterior (${pKm.toFixed(1)} → ${wKm.toFixed(1)} km). ${kmChg>15?"Cuidado para não aumentar mais de 10% por semana — risco de lesão.":kmChg<-25?"Volume reduzido. Se foi intencional (semana de descarga), ótimo.":"Progressão segura."}`);
  }

  // Pace
  if(wSpd>0){
    if(pSpd>0){
      const faster=paceChg<-0.05;
      points.push(`${faster?"⚡ Ritmo melhorou":"🧘 Ritmo mais conservador"} — ${paceMs(wSpd)}/km esta semana vs ${paceMs(pSpd)}/km na anterior. ${faster?"Adaptação positiva — o treino está surtindo efeito.":"Ritmo mais tranquilo pode indicar fadiga ou treino de recuperação."}`);
    } else {
      points.push(`⚡ Ritmo médio: ${paceMs(wSpd)}/km — resultado ${paceN(wSpd)<9?"acima da média":"dentro do esperado"} para sua fase de treinamento.`);
    }
  }

  // HR
  if(avgHR){
    const zone=avgHR<118?"Z1 (recuperação)":avgHR<148?"Z2 (aeróbico base)":avgHR<162?"Z3 (aeróbico intenso)":avgHR<176?"Z4 (limiar)":"Z5 (máximo)";
    const tip=avgHR<148?"Maioria do tempo em base aeróbica — ideal para construção de resistência.":avgHR<162?"Intensidade moderada a alta — equilibre com dias de recuperação.":"Alta intensidade — garanta 48h de descanso entre sessões.";
    points.push(`❤️ FC média: ${avgHR} bpm (${zone}). ${tip}`);
  }

  // Effort
  if(effort>0) points.push(`🔥 Esforço relativo acumulado: ${effort} pontos. ${effort>150?"Semana de alta carga — priorize sono e nutrição.":effort>80?"Carga moderada — bem calibrada para evolução.":"Carga leve — bom para semanas de recuperação."}`);

  const conclusion=isCurrent
    ?(kmChg>0&&paceChg<0?"Semana excelente: mais volume e ritmo melhor. Exatamente o padrão de quem evolui.":wRuns.length>=3?"Semana consistente. Mantenha a frequência — ela é mais importante que a intensidade.":"Frequência baixa. Tente adicionar pelo menos uma corrida curta esta semana.")
    :(paceChg<-0.1?"Semana com evolução de ritmo — sinal positivo de adaptação.":"Semana dentro do padrão de construção de base.");

  const headline=`${wRuns.length} corrida${wRuns.length>1?"s":""} · ${wKm.toFixed(1)} km${pKm>0?" ("+( kmChg>=0?"+":"")+kmChg.toFixed(0)+"% vs semana ant.)":""}`;
  return{headline,points,conclusion};
}

function analyzeSixMonths(monthlyData, totalKm, runCount, streak, biggestKm, acts){
  if(!monthlyData||monthlyData.length<2) return null;
  const first=monthlyData[0],last=monthlyData[monthlyData.length-1];
  const paceImp=first.pace-last.pace;
  const paceImpMin=Math.floor(paceImp),paceImpSec=Math.round((paceImp-paceImpMin)*60);
  const paceImpStr=`${paceImpMin}:${String(paceImpSec).padStart(2,"0")}`;
  const volGrowth=first.km>0?((last.km-first.km)/first.km*100):0;
  const maxMonth=[...monthlyData].sort((a,b)=>b.km-a.km)[0];
  const avgFreq=Math.round(runCount/monthlyData.length);
  const runsPerMonth=monthlyData.map(m=>m.corridas);
  const freqGrowth=runsPerMonth[runsPerMonth.length-1]-runsPerMonth[0];

  return{
    intro:`O número mais importante: seu ritmo saiu de ${paceStr(first.pace)}/km em ${first.label} para ${paceStr(last.pace)}/km em ${last.label} — ${paceImpStr} de melhora em ${monthlyData.length} meses. Para um iniciante, isso é acima da curva.`,
    points:[
      {icon:"🔥",title:"Consistência fora do normal",text:`${streak} semanas consecutivas sem uma semana em branco — média de ${avgFreq} corrida${avgFreq>1?"s":""} por mês. Isso é o que separa atletas que evoluem dos que ficam no mesmo lugar. Você acertou no mais difícil.`},
      {icon:"📈",title:"Volume crescendo com qualidade",text:`De ${first.km.toFixed(0)} km no primeiro mês para ${last.km.toFixed(0)} km no último (${volGrowth>0?"+":""}${volGrowth.toFixed(0)}%). Melhor mês: ${maxMonth.label} com ${maxMonth.km.toFixed(1)} km. ${freqGrowth>2?"Frequência de treinos também aumentou — bom sinal de comprometimento.":"Frequência estável — consistência é mais valiosa que volume."}`},
      {icon:"🎯",title:"O próximo passo está claro",text:`Sua maior corrida foi ${biggestKm} km. Para evoluir agora, adicione uma corrida longa semanal — começa com ${(biggestKm+1).toFixed(0)}–${(biggestKm+2).toFixed(0)} km aos sábados, progressivo. Com isso no lugar, um 10K até agosto é totalmente factível.`}
    ],
    conclusion:`Com ${totalKm} km em ${runCount} corridas em ${monthlyData.length} meses, a base está sólida. Ritmo de ${paceStr(last.pace)}/km como média recente. Meta realista: ${paceStr(last.pace-0.2)}/km nos próximos 60 dias aumentando volume da corrida longa.`
  };
}

/* ── SVG CHARTS ── */
function LineChart({data,dataKey,color,h:H=120,reversed=false,fmtY}){
  const vals=data.map(d=>d[dataKey]).filter(v=>v!=null);
  if(!vals.length)return null;
  let min=Math.min(...vals),max=Math.max(...vals);
  const range=max-min||1;
  const W=320,pad=10;
  const pts=data.filter(d=>d[dataKey]!=null).map((d,i,arr)=>({
    x:pad+(i/Math.max(arr.length-1,1))*(W-pad*2),
    y:reversed
      ?(pad+((d[dataKey]-min)/range)*(H-pad*2-14))
      :(H-14-pad-((d[dataKey]-min)/range)*(H-pad*2-14)),
    v:d[dataKey],lbl:d.label
  }));
  const path=pts.map((p,i)=>`${i===0?"M":"L"}${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
  const area=pts.length>1?(path+` L${pts[pts.length-1].x.toFixed(1)},${H-14} L${pts[0].x.toFixed(1)},${H-14} Z`):null;
  const gid="g"+dataKey+Math.random().toString(36).slice(2,6);
  const lblStep=Math.max(1,Math.ceil(pts.length/5));
  return h("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:H}},
    h("defs",null,h("linearGradient",{id:gid,x1:"0",y1:"0",x2:"0",y2:"1"},
      h("stop",{offset:"0%",stopColor:color,stopOpacity:0.25}),
      h("stop",{offset:"100%",stopColor:color,stopOpacity:0})
    )),
    area&&h("path",{d:area,fill:`url(#${gid})`}),
    h("path",{d:path,fill:"none",stroke:color,strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"}),
    pts.map((p,i)=>h("circle",{key:i,cx:p.x,cy:p.y,r:3,fill:color})),
    pts.filter((_,i)=>i%lblStep===0||i===pts.length-1).map((p,i)=>
      h("text",{key:i,x:p.x,y:H,textAnchor:"middle",fontSize:9,fill:T.muted},p.lbl)
    )
  );
}

function BarChart({data,dataKey,color,h:H=100}){
  const vals=data.map(d=>d[dataKey]||0);
  const max=Math.max(...vals,1);
  const W=320,pad=10,n=data.length;
  const bw=Math.min(24,(W-pad*2)/n-4);
  const lblStep=Math.max(1,Math.ceil(n/5));
  return h("svg",{viewBox:`0 0 ${W} ${H}`,style:{width:"100%",height:H}},
    data.map((d,i)=>{
      const x=pad+(i/(n))*(W-pad*2)+bw*0.2;
      const bh=((d[dataKey]||0)/max)*(H-18);
      return h("g",{key:i},
        h("rect",{x,y:H-16-bh,width:bw,height:Math.max(bh,1),fill:color,rx:3,opacity:0.85}),
        (i%lblStep===0||i===n-1)&&h("text",{x:x+bw/2,y:H,textAnchor:"middle",fontSize:9,fill:T.muted},d.label)
      );
    })
  );
}

function HRZonesChart({pct,ranges}){
  if(!pct||!ranges)return h("div",{style:{color:T.muted,fontSize:12,padding:"12px 0"}},"Dados de zonas não disponíveis");
  const colors=[T.z1,T.z2,T.z3,T.z4,T.z5];
  const labels=["Z1","Z2","Z3","Z4","Z5"];
  const bpmLabels=ranges.map(({min,max},i)=>i===ranges.length-1?`>${min} bpm`:`${min}–${max} bpm`);
  const dominantZone=pct.indexOf(Math.max(...pct));
  return h("div",null,
    h("div",{style:{fontSize:13,fontWeight:600,color:T.text,marginBottom:12}},
      `${pct[dominantZone]}% em Zona ${dominantZone+1}`,
      h("span",{style:{fontSize:11,color:T.muted,fontWeight:400,marginLeft:8}},
        `(${bpmLabels[dominantZone]})`
      )
    ),
    h("div",{style:{display:"flex",flexDirection:"column",gap:8}},
      [4,3,2,1,0].map(i=>
        h("div",{key:i,style:{display:"flex",alignItems:"center",gap:8}},
          h("div",{style:{width:24,fontSize:11,color:T.muted,fontWeight:600,flexShrink:0}},labels[i]),
          h("div",{style:{flex:1,background:"#222",borderRadius:4,height:18,position:"relative",overflow:"hidden"}},
            h("div",{style:{width:`${Math.max(pct[i],1)}%`,height:"100%",background:colors[i],borderRadius:4,transition:"width 0.6s ease"}})
          ),
          h("div",{style:{width:36,fontSize:12,fontWeight:700,color:pct[i]>20?colors[i]:T.muted,textAlign:"right",flexShrink:0}},`${pct[i]}%`),
          h("div",{style:{width:80,fontSize:10,color:T.muted,textAlign:"right",flexShrink:0}},bpmLabels[i])
        )
      )
    )
  );
}

      return h("div",{key:i,style:{
        background:T.card2,
        border:`2px solid ${runA?T.orange:gymA?T.blue:T.border}`,
        borderRadius:12,padding:"8px 4px",textAlign:"center",minHeight:100
      }},
        h("div",{style:{fontSize:9,fontWeight:700,letterSpacing:0.5,
          color:runA?T.orange:gymA?T.blue:T.muted}},DAYS[date.getDay()]),
        h("div",{style:{fontSize:8,color:T.muted,marginBottom:4}},
          `${String(date.getDate()).padStart(2,"0")}/${String(date.getMonth()+1).padStart(2,"0")}`),
        runA?h(Fragment,null,
          h("div",{style:{fontSize:18,marginBottom:2}},"🏃"),
          h("div",{className:"syne",style:{fontSize:14,color:T.text,lineHeight:1.1}},
            (runA.distance/1000).toFixed(1)),
          h("div",{style:{fontSize:8,color:T.muted}},`km`),
          h("div",{style:{fontSize:8,color:T.orange,margin:"2px 0"}},paceMs(runA.average_speed)+"/km"),
          runA.has_heartrate&&h("div",{style:{fontSize:8,color:T.muted}},
            Math.round(runA.average_heartrate)+"bpm"),
          isPR&&h("div",{style:{display:"inline-block",marginTop:3,padding:"2px 5px",borderRadius:100,
            background:T.orange,color:"#fff",fontSize:8,fontWeight:700}},"🏅 RP")
        ):gymA?h(Fragment,null,
          h("div",{style:{fontSize:18,marginBottom:4}},"🏋️"),
          h("div",{style:{fontSize:9,color:T.muted}},gymA.name||"Musculação")
        ):h(Fragment,null,
          h("div",{style:{fontSize:18,marginBottom:4}},"😴"),
          h("div",{style:{fontSize:9,color:T.muted}},"Descanso")
        )
      );
    })
  );
}

function WeekView({acts,offset,prevActs,zoneRanges}){
  const weekActs=useMemo(()=>getWeekActs(acts,offset),[acts,offset]);
  const prev=useMemo(()=>prevActs||getWeekActs(acts,offset+1),[acts,offset,prevActs]);
  const days=useMemo(()=>getWeekDays(acts,offset),[acts,offset]);
  const runs=weekActs.filter(a=>isRun(a.type));
  const pRuns=prev.filter(a=>isRun(a.type));
  const totalKm=runs.reduce((s,r)=>s+r.distance/1000,0);
  const avgPace=runs.length?runs.reduce((s,r)=>s+r.average_speed,0)/runs.length:0;
  const avgHRruns=runs.filter(r=>r.has_heartrate);
  const avgHR=avgHRruns.length?Math.round(avgHRruns.reduce((s,r)=>s+r.average_heartrate,0)/avgHRruns.length):null;
  const effort=runs.reduce((s,r)=>s+(r.suffer_score||0),0);
  const pKm=pRuns.reduce((s,r)=>s+r.distance/1000,0);
  const kmChg=pKm>0?((totalKm-pKm)/pKm*100):null;
  const analysis=useMemo(()=>analyzeWeek(weekActs,prev,offset===0),[weekActs,prev,offset]);
  const zonePct=useMemo(()=>aggregateZones(weekActs,zoneRanges),[weekActs,zoneRanges]);

  return h("div",null,
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}},
      h(StatChip,{val:totalKm.toFixed(1),label:"km total",color:T.orange,
        sub:kmChg!=null?`${kmChg>=0?"+":""}${kmChg.toFixed(0)}% vs ant.`:null}),
      h(StatChip,{val:avgPace?paceMs(avgPace):"--",label:"pace médio"}),
      h(StatChip,{val:runs.length,label:"corridas"}),
      h(StatChip,{val:avgHR||"--",label:"fc média",color:avgHR?T.blue:T.muted,sub:avgHR?"bpm":null})
    ),

    h(Sec,null,"Análise do Coach"),
    h(AnalysisCard,{data:analysis}),

    h(Sec,null,"Dias da Semana"),
    h(DayGrid,{days}),

    runs.length>0&&h(Fragment,null,
      h(Sec,null,"Pace por Corrida"),
      h("div",{style:card({padding:14})},
        h(LineChart,{
          data:runs.slice().reverse().map((r,i)=>({label:fmtDay(r.start_date),pace:paceN(r.average_speed)})),
          dataKey:"pace",color:T.orange,h:110,reversed:true
        }),
        h("div",{style:{fontSize:10,color:T.muted,textAlign:"center",marginTop:4}},"menor = mais rápido")
      ),

      h(Sec,null,"Zonas de Frequência Cardíaca"),
      h("div",{style:card({padding:14})},
        h(HRZonesChart,{pct:zonePct,ranges:zoneRanges})
      )
    )
  );
}

function SixMonthView({acts,stats,zoneRanges}){
  const since=useMemo(()=>{const d=new Date();d.setMonth(d.getMonth()-6);return d;},[]);
  const recent=useMemo(()=>acts.filter(a=>new Date(a.start_date)>=since),[acts,since]);
  const runs=recent.filter(a=>isRun(a.type));
  const monthly=useMemo(()=>buildMonthly(recent),[recent]);
  const streak=useMemo(()=>calcStreak(acts),[acts]);
  const totalKm=+(runs.reduce((s,r)=>s+r.distance/1000,0)).toFixed(0);
  const biggest=runs.length?[...runs].sort((a,b)=>b.distance-a.distance)[0]:null;
  const biggestKm=biggest?+(biggest.distance/1000).toFixed(1):0;
  const analysis=useMemo(()=>analyzeSixMonths(monthly,totalKm,runs.length,streak,biggestKm,recent),[monthly,totalKm,runs.length,streak,biggestKm]);
  const zonePct=useMemo(()=>aggregateZones(recent,zoneRanges),[recent,zoneRanges]);
  const ytd=stats?.ytd_run_totals;

  return h("div",null,
    // YTD Stats
    h("div",{style:{display:"grid",gridTemplateColumns:"repeat(2,1fr)",gap:8}},
      h(StatChip,{val:totalKm,label:"km totais",color:T.orange,sub:`${runs.length} corridas`}),
      h(StatChip,{val:paceMs(runs.length?runs.reduce((s,r)=>s+r.average_speed,0)/runs.length:0),label:"pace médio"}),
      h(StatChip,{val:streak,label:"semanas seguidas",color:T.orange}),
      h(StatChip,{val:biggestKm,label:"maior corrida",sub:"km"})
    ),

    // Streak bar
    h("div",{style:{...card({padding:16}),background:T.orangeDim,border:`1px solid ${T.orangeBorder}`,marginTop:8}},
      h("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:6}},
        h("span",{style:{fontSize:20}},"🔥"),
        h("div",{className:"syne",style:{fontSize:18,color:T.text}},
          h("span",{style:{color:T.orange}},streak)," semanas consecutivas"
        )
      ),
      h("div",{style:{fontSize:11,color:T.muted,marginBottom:10}},
        `Meta de 52 semanas — ${Math.round(streak/52*100)}% concluído · ${52-streak} restantes`),
      h("div",{style:{background:"#333",borderRadius:100,height:6}},
        h("div",{style:{background:T.orange,borderRadius:100,height:6,width:`${Math.min(streak/52*100,100)}%`}})
      )
    ),

    h(Sec,null,"Análise dos 6 Meses"),
    h(AnalysisCard,{data:analysis}),

    monthly.length>1&&h(Fragment,null,
      h(Sec,null,"Ritmo Médio por Mês"),
      h("div",{style:card({padding:14})},
        h("div",{style:{fontSize:10,color:T.muted,marginBottom:8}},"min/km — menor = mais rápido"),
        h(LineChart,{data:monthly,dataKey:"pace",color:T.orange,h:120,reversed:true})
      ),

      h(Sec,null,"Volume Mensal (km)"),
      h("div",{style:card({padding:14})},
        h(BarChart,{data:monthly,dataKey:"km",color:T.orange,h:100})
      ),

      h(Sec,null,"Frequência de Corridas"),
      h("div",{style:card({padding:14})},
        h(BarChart,{data:monthly,dataKey:"corridas",color:"#888",h:85})
      ),

      monthly.some(m=>m.hr)&&h(Fragment,null,
        h(Sec,null,"FC Média por Mês"),
        h("div",{style:card({padding:14})},
          h("div",{style:{fontSize:10,color:T.muted,marginBottom:8}},"tendência de adaptação cardiovascular"),
          h(LineChart,{data:monthly.filter(m=>m.hr),dataKey:"hr",color:T.blue,h:110})
        )
      )
    ),

    h(Sec,null,"Zonas de Frequência Cardíaca · 6 Meses"),
    h("div",{style:card({padding:14})},
      h(HRZonesChart,{pct:zonePct,ranges:zoneRanges})
    )
  );
}

/* ── STRAVA AUTH & API ── */
async function refreshTok(rt){
  const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({client_id:CLIENT_ID,client_secret:CLIENT_SEC,refresh_token:rt,grant_type:"refresh_token"})});
  const d=await r.json();
  if(d.access_token){ls.set("s_tok",d);return d.access_token;}
  throw new Error("Falha ao renovar token");
}
async function getToken(tok){
  if(!tok)return null;
  if(Date.now()/1000<(tok.expires_at||0)-60)return tok.access_token;
  return refreshTok(tok.refresh_token);
}
async function apiGet(path,tok){
  const t=await getToken(tok);if(!t)throw new Error("sem token");
  const r=await fetch(SAPI+path,{headers:{Authorization:`Bearer ${t}`}});
  if(!r.ok)throw new Error(`Erro ${r.status}`);return r.json();
}

/* ── SPLASH ── */
function Splash({msg}){
  return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",background:T.bg,gap:14}},
    h("div",{style:{width:64,height:64,background:T.orange,borderRadius:16,
      display:"flex",alignItems:"center",justifyContent:"center",
      fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:32,color:"#fff"}
    },"S"),
    h("div",{className:"syne",style:{fontSize:18,color:T.text}},"Strava Performance"),
    h("div",{style:{fontSize:13,color:T.muted,marginTop:4}},msg),
    h("div",{style:{width:40,height:3,background:T.orange,borderRadius:3,marginTop:8}})
  );
}

/* ── MAIN APP ── */
function App(){
  const[tok,setTok]=useState(()=>ls.get("s_tok"));
  const[athlete,setAthlete]=useState(null);
  const[acts,setActs]=useState([]);
  const[stats,setStats]=useState(null);
  const[zoneRanges,setZoneRanges]=useState(null);
  const[loading,setLoading]=useState(true);
  const[status,setStatus]=useState("Iniciando...");
  const[error,setError]=useState("");
  const[tab,setTab]=useState("atual"); // atual | anterior | meses
  const[refreshing,setRefreshing]=useState(false);
  const[lastUpdate,setLastUpdate]=useState(null);

  const loadData=useCallback(async(token)=>{
    const t=token||tok;
    setStatus("Carregando atividades...");
    const[ath,activities,st,zones]=await Promise.all([
      apiGet("/athlete",t),
      apiGet("/athlete/activities?per_page=200",t),
      apiGet(`/athletes/${(await apiGet("/athlete",t)).id}/stats`,t).catch(()=>null),
      apiGet("/athlete/zones",t).catch(()=>null)
    ]);
    // Actually refetch to avoid double /athlete call
    const ath2=await apiGet("/athlete",t);
    const acts2=await apiGet("/athlete/activities?per_page=200",t);
    const st2=await apiGet(`/athletes/${ath2.id}/stats`,t).catch(()=>null);
    const z2=await apiGet("/athlete/zones",t).catch(()=>null);
    setAthlete(ath2);setActs(acts2);setStats(st2);
    if(z2?.heart_rate?.zones)setZoneRanges(z2.heart_rate.zones);
    setLastUpdate(new Date());
  },[tok]);

  const fastLoad=useCallback(async(t)=>{
    const[ath,activities]=await Promise.all([
      apiGet("/athlete",t),
      apiGet("/athlete/activities?per_page=200",t)
    ]);
    setAthlete(ath);setActs(activities);
    const[st,z]=await Promise.all([
      apiGet(`/athletes/${ath.id}/stats`,t).catch(()=>null),
      apiGet("/athlete/zones",t).catch(()=>null)
    ]);
    setStats(st);
    if(z?.heart_rate?.zones)setZoneRanges(z.heart_rate.zones);
    setLastUpdate(new Date());
  },[]);

  useEffect(()=>{
    (async()=>{
      // Handle OAuth callback
      const p=new URLSearchParams(window.location.search);
      const code=p.get("code");
      if(code){
        window.history.replaceState({},"",window.location.pathname);
        setStatus("Autorizando com o Strava...");
        try{
          const r=await fetch(STOK,{method:"POST",headers:{"Content-Type":"application/json"},
            body:JSON.stringify({client_id:CLIENT_ID,client_secret:CLIENT_SEC,code,grant_type:"authorization_code"})});
          const d=await r.json();
          if(!d.access_token)throw new Error(d.message||"Token inválido");
          ls.set("s_tok",d);setTok(d);
          setStatus("Carregando seus treinos...");
          await fastLoad(d);
          setLoading(false);return;
        }catch(e){setError(e.message);setLoading(false);return;}
      }
      // Use saved token
      const saved=ls.get("s_tok");
      if(saved){
        setStatus("Conectando ao Strava...");
        try{await fastLoad(saved);setLoading(false);return;}
        catch(e){ls.del("s_tok");}
      }
      // Redirect to Strava
      setStatus("Abrindo o Strava...");
      await new Promise(r=>setTimeout(r,600));
      window.location.href=`${SAUTH}?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT)}&response_type=code&approval_prompt=auto&scope=read,activity:read_all`;
    })();
  },[]);

  const handleRefresh=async()=>{
    setRefreshing(true);
    try{await fastLoad(tok);}catch(e){setError(e.message);}
    setRefreshing(false);
  };

  if(loading&&!error)return h(Splash,{msg:status});
  if(error)return h("div",{style:{minHeight:"100vh",display:"flex",flexDirection:"column",
    alignItems:"center",justifyContent:"center",padding:24,gap:16,background:T.bg}},
    h("div",{style:{fontSize:40}},"⚠️"),
    h("div",{className:"syne",style:{fontSize:18}},"Erro de conexão"),
    h("div",{style:{fontSize:13,color:T.muted,textAlign:"center",maxWidth:300}},error),
    h("button",{onClick:()=>{ls.del("s_tok");window.location.reload();},
      style:{background:T.orange,border:"none",borderRadius:10,padding:"12px 28px",
        color:"#fff",fontSize:14,fontWeight:700,marginTop:8}},"Tentar novamente")
  );

  const updStr=lastUpdate?lastUpdate.toLocaleDateString("pt-BR",{day:"2-digit",month:"short",year:"numeric"}):"—";

  return h("div",{style:{background:T.bg,minHeight:"100vh",maxWidth:430,margin:"0 auto",paddingBottom:40}},

    /* HEADER */
    h("div",{style:{background:"#111",borderBottom:`1px solid ${T.border}`,
      padding:"14px 18px 12px",position:"sticky",top:0,zIndex:50}},
      h("div",{style:{display:"flex",alignItems:"center",gap:12}},
        h("div",{style:{width:44,height:44,background:T.orange,borderRadius:12,flexShrink:0,
          display:"flex",alignItems:"center",justifyContent:"center",
          fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:"#fff"}},"S"),
        h("div",{style:{flex:1,minWidth:0}},
          h("div",{className:"syne",style:{fontSize:16,color:T.text,lineHeight:1.2}},
            athlete?`${athlete.firstname} ${athlete.lastname}`:"—"),
          h("div",{style:{fontSize:11,color:T.muted}},"Strava · Dashboard de Performance")
        )
      ),
      h("div",{style:{display:"flex",alignItems:"center",gap:8,marginTop:10}},
        h("div",{style:{background:"#1A1A1A",border:`1px solid ${T.border}`,borderRadius:8,
          padding:"4px 10px",fontSize:11,color:T.muted}},
          "Atualizado: ",h("span",{style:{color:T.orange,fontWeight:600}},updStr)
        ),
        h("button",{onClick:handleRefresh,disabled:refreshing,
          style:{background:"transparent",border:`1px solid ${T.orange}`,borderRadius:8,
            padding:"4px 12px",color:T.orange,fontSize:11,fontWeight:600,
            opacity:refreshing?0.5:1}},
          refreshing?"...":"⟳ Atualizar dados"
        )
      ),

      /* TABS */
      h("div",{style:{display:"flex",gap:4,marginTop:10}},
        [["atual","Esta Semana"],["anterior","Semana Ant."],["meses","6 Meses"]].map(([key,lbl])=>
          h("button",{key,onClick:()=>setTab(key),style:{
            flex:1,padding:"7px 0",borderRadius:8,fontSize:11,fontWeight:600,border:"none",
            background:tab===key?T.orange:"#1A1A1A",
            color:tab===key?"#fff":T.muted,transition:"all 0.15s"
          }},lbl)
        )
      )
    ),

    /* CONTENT */
    h("div",{style:{padding:"14px 14px 0"}},
      tab!=="meses"&&h("div",{style:{fontSize:11,color:T.muted,marginBottom:10}},
        weekLabel(tab==="atual"?0:1)
      ),
      tab==="atual"&&h(WeekView,{acts,offset:0,zoneRanges}),
      tab==="anterior"&&h(WeekView,{acts,offset:1,zoneRanges}),
      tab==="meses"&&h(SixMonthView,{acts,stats,zoneRanges}),

      h("div",{style:{marginTop:18,padding:"10px 14px",background:"#111",
        border:`1px dashed ${T.border}`,borderRadius:10,fontSize:10,color:T.muted,textAlign:"center"}},
        "📱 Safari → Compartilhar → Adicionar à Tela de Início"
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(h(App));
</script>
